
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight FM — Piano Test</title>
<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: 20px; background: #0c1120; color: #e8e7f0;
  font-family: Georgia, serif;
}
main {
  width: min(420px, 100%); padding: 28px;
  border: 1px solid #343d54; border-radius: 18px;
  background: #151b2b; text-align: center;
}
h1 { font-weight: normal; letter-spacing: 3px; }
p { color: #a5aec5; line-height: 1.5; }
button {
  width: 100%; margin-top: 12px; padding: 14px;
  border: 1px solid #47536f; border-radius: 24px;
  background: #29344c; color: white; cursor: pointer;
}
button:disabled { opacity: .45; cursor: wait; }
#status {
  margin-top: 20px; color: #a5aec5;
  font: 12px/1.6 Arial, sans-serif; overflow-wrap: anywhere;
}
</style>
</head>
<body>
<main>
  <h1>Midnight FM</h1>
  <p>Проверяем меланхоличное акустическое пианино</p>
  <button id="load">Загрузить пианино</button>
  <button id="chord" disabled>Послушать аккорд</button>
  <button id="melody" disabled>Послушать мелодию</button>
  <div id="status">Нажми «Загрузить пианино»</div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const loadButton = $("load");
  const chordButton = $("chord");
  const melodyButton = $("melody");
  const status = $("status");

  let piano = null;
  let reverb = null;
  let ready = false;
  let loading = false;
  let playingDemo = false;

  function message(text) {
    status.textContent = text;
  }

  async function loadPiano() {
    if (loading || ready) return;

    if (typeof Tone === "undefined") {
      message("Tone.js не загрузился. Обнови страницу.");
      return;
    }

    loading = true;
    loadButton.disabled = true;
    message("Загружаем записи пианино…");

    try {
      await Tone.start();

      reverb = new Tone.Reverb({
        decay: 3,
        wet: 0.16
      });
      await reverb.generate();
      reverb.toDestination();

      piano = new Tone.Sampler({
        urls: {
          C3: "C3.mp3",
          "D#3": "Ds3.mp3",
          "F#3": "Fs3.mp3",
          A3: "A3.mp3",
          C4: "C4.mp3",
          "D#4": "Ds4.mp3",
          "F#4": "Fs4.mp3",
          A4: "A4.mp3",
          C5: "C5.mp3",
          "D#5": "Ds5.mp3",
          "F#5": "Fs5.mp3",
          A5: "A5.mp3",
          C6: "C6.mp3"
        },
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        attack: 0.02,
        release: 2
      });

      piano.connect(reverb);
      piano.volume.value = -5;

      await Tone.loaded();

      ready = true;
      chordButton.disabled = false;
      melodyButton.disabled = false;
      message("Пианино готово! Выбирай, что послушать.");
    } catch (error) {
      console.error(error);
      if (piano) piano.dispose();
      if (reverb) reverb.dispose();
      piano = null;
      reverb = null;
      loadButton.disabled = false;
      message("Ошибка загрузки: " + error.message);
    } finally {
      loading = false;
    }
  }

  function setDemoBusy(busy) {
    playingDemo = busy;
    chordButton.disabled = busy || !ready;
    melodyButton.disabled = busy || !ready;
  }

  async function playChord() {
    if (!ready || playingDemo) return;

    try {
      await Tone.start();
      setDemoBusy(true);
      piano.triggerAttackRelease(
        ["C4", "D#4", "G4", "A#4"],
        3.5,
        Tone.now() + 0.1,
        0.55
      );
      message("Звучит меланхоличный аккорд…");
      setTimeout(() => {
        setDemoBusy(false);
        message("Готово! Попробуй мелодию.");
      }, 4500);
    } catch (error) {
      console.error(error);
      setDemoBusy(false);
      message("Ошибка воспроизведения: " + error.message);
    }
  }

  async function playMelody() {
    if (!ready || playingDemo) return;

    try {
      await Tone.start();
      setDemoBusy(true);

      const notes = [
        ["G4", 0, 0.48],
        ["D#4", 0.55, 0.42],
        ["C4", 1.2, 0.58],
        ["D4", 1.95, 0.38],
        ["G4", 2.45, 0.48],
        ["A#4", 3.15, 0.42],
        ["G4", 3.85, 0.48],
        ["D#4", 4.5, 0.4],
        ["D4", 5.15, 0.36],
        ["C4", 5.85, 0.52]
      ];

      const start = Tone.now() + 0.1;
      notes.forEach(([note, offset, velocity]) => {
        piano.triggerAttackRelease(
          note, 1.1, start + offset, velocity
        );
      });

      message("Звучит ночная мелодия…");
      setTimeout(() => {
        setDemoBusy(false);
        message("Как тебе тембр пианино?");
      }, 8500);
    } catch (error) {
      console.error(error);
      setDemoBusy(false);
      message("Ошибка воспроизведения: " + error.message);
    }
  }

  loadButton.addEventListener("click", loadPiano);
  chordButton.addEventListener("click", playChord);
  melodyButton.addEventListener("click", playMelody);
})();
</script>
</body>
</html>
