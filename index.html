<!DOCTYPE html>
<html lang="ru" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>lofi.gen</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root,[data-theme="night"]{--bg:#121212;--surface:#1E1E1E;--border:#333;--text:#E0D8D0;--text-muted:#8A7A68;--text-dim:#5C5045;--accent:#C9A87C;--accent-2:#9B7FA6;--accent-glow:rgba(201,168,124,.2);--btn-primary-text:#121212}
[data-theme="day"]{--bg:#F5EFE6;--surface:#FFF;--border:#D8CFC2;--text:#3D3028;--text-muted:#7A6B5E;--text-dim:#A89888;--accent:#8B5E3C;--accent-2:#B87D9E;--accent-glow:rgba(139,94,60,.15);--btn-primary-text:#FFF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'SF Mono','Courier New',monospace;overflow:hidden;user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(160,130,180,.06),transparent 50%),var(--bg);z-index:-1}
.app{height:100dvh;display:flex;flex-direction:column;padding:12px 16px;max-width:520px;margin:0 auto;gap:10px}
.header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.brand-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;min-height:0}
.vinyl-wrap{position:relative;width:clamp(160px,46vw,210px);height:clamp(160px,46vw,210px);margin:0 auto}
.vinyl{width:100%;height:100%;border-radius:50%;position:relative;background:radial-gradient(circle,#0a0a0a 0%,#0a0a0a 12%,transparent 12%),radial-gradient(circle,var(--accent-2) 12%,var(--accent-2) 32%,transparent 32%),repeating-radial-gradient(circle,#0a0a0a 0px,#0a0a0a 1px,#1a1a1a 1px,#1a1a1a 2.5px,#151515 2.5px,#151515 3px);box-shadow:0 16px 40px rgba(0,0,0,.5);animation:spin 6s linear infinite;animation-play-state:paused}
.vinyl.spinning{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32%;height:32%;border-radius:50%;background:radial-gradient(circle,var(--accent-2),#8B5C75);display:flex;align-items:center;justify-content:center}
.vinyl-label::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:var(--bg)}
.label-text{font-size:10px;font-weight:700;color:#0a0a0a;text-align:center;line-height:1.1}
.glow{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow),transparent 60%);opacity:0;transition:opacity .5s;pointer-events:none;z-index:-1}
.glow.active{opacity:1;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.05);opacity:1}}
.now-playing{text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.np-title{font-size:clamp(18px,5vw,22px);font-weight:600;color:var(--text);line-height:1.15;padding:0 10px}
.np-meta{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.controls{display:flex;align-items:center;justify-content:center;gap:18px}
.btn{border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);background:none}
.btn:active{transform:scale(.93)}
.btn svg{width:20px;height:20px}
.btn-play{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--btn-primary-text);box-shadow:0 5px 18px var(--accent-glow)}
.btn-play svg{width:26px;height:26px}
.btn-ctrl{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--border)}
.genres{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;justify-content:center}
.genres::-webkit-scrollbar{display:none}
.genre{flex-shrink:0;padding:7px 14px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:16px;cursor:pointer}
.genre.active{background:var(--accent);color:var(--btn-primary-text);border-color:var(--accent)}
.volume-row{display:flex;align-items:center;gap:10px}
.mute-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px}
.mute-btn.muted{opacity:.35}
.volume-slider{flex:1;height:3px;-webkit-appearance:none;appearance:none;background:var(--surface);border-radius:2px;outline:none;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent)}
.footer{display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);padding-top:8px;border-top:1px solid var(--border)}
.footer-time{color:var(--accent);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><span class="brand-dot"></span><span>lofi.gen</span></div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </header>
  <main class="main">
    <div class="vinyl-wrap">
      <div class="vinyl" id="vinyl"><div class="vinyl-label"><div class="label-text">LO<br>FI</div></div></div>
      <div class="glow" id="glow"></div>
    </div>
    <div class="now-playing">
      <div class="np-title" id="npTitle">Press play</div>
      <div class="np-meta" id="npMeta">generative</div>
    </div>
    <div class="controls">
      <button class="btn btn-ctrl" id="nextBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="btn btn-play" id="playBtn">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button class="btn btn-ctrl" id="shuffleBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
    </div>
    <div class="genres" id="genresWrap"></div>
    <div class="volume-row">
      <button class="mute-btn" id="muteBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg></button>
      <input type="range" min="0" max="100" value="65" class="volume-slider" id="volumeSlider">
    </div>
  </main>
  <footer class="footer"><span id="footerInfo">ready</span><span class="footer-time" id="elapsed">00:00</span></footer>
</div>

<script>
// ============================================================
// TELEGRAM
// ============================================================
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#121212'); tg.setBackgroundColor('#121212'); } catch(e){} }

const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);

// ============================================================
// MUSIC THEORY
// ============================================================
const ALL_KEYS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KEY_MIDI = { C:60, 'C#':61, D:62, 'D#':63, E:64, F:65, 'F#':66, G:67, 'G#':68, A:69, 'A#':70, B:71 };

const CHORD_TONES = {
  maj7: [0,4,7,11], m7: [0,3,7,10], '7': [0,4,7,10],
  maj9: [0,4,7,11,14], m9: [0,3,7,10,14], '9': [0,4,7,10,14],
  '13': [0,4,7,10,21], '6': [0,4,7,9], m6: [0,3,7,9], m7b5: [0,3,6,10]
};

const PROGRESSIONS = {
  chillhop: [
    [{r:'D',q:'m9'},{r:'G',q:'13'},{r:'C',q:'maj9'},{r:'A',q:'m9'}],
    [{r:'C',q:'maj9'},{r:'A',q:'m9'},{r:'D',q:'m9'},{r:'G',q:'13'}],
    [{r:'F',q:'maj9'},{r:'E',q:'m7'},{r:'D',q:'m9'},{r:'C',q:'maj9'}],
    [{r:'A',q:'m9'},{r:'F',q:'maj9'},{r:'C',q:'maj9'},{r:'G',q:'13'}],
  ],
  jazzhop: [
    [{r:'D',q:'m9'},{r:'G',q:'13'},{r:'C',q:'maj9'},{r:'A',q:'m9'}],
    [{r:'C',q:'maj9'},{r:'A',q:'m9'},{r:'D',q:'m9'},{r:'G',q:'13'}],
    [{r:'E',q:'m7'},{r:'A',q:'7'},{r:'D',q:'m9'},{r:'G',q:'13'}],
    [{r:'F',q:'maj9'},{r:'E',q:'m7'},{r:'D',q:'m9'},{r:'G',q:'13'}],
  ],
  ambient: [
    [{r:'F',q:'maj9'},{r:'C',q:'maj9'},{r:'G',q:'9'},{r:'A',q:'m9'}],
    [{r:'C',q:'maj9'},{r:'F',q:'maj9'},{r:'A',q:'m9'},{r:'G',q:'9'}],
  ],
  sleepy: [
    [{r:'C',q:'maj7'},{r:'F',q:'maj7'},{r:'D',q:'m7'},{r:'G',q:'7'}],
    [{r:'F',q:'maj7'},{r:'C',q:'maj7'},{r:'A',q:'m7'},{r:'G',q:'7'}],
    [{r:'D',q:'m7'},{r:'G',q:'7'},{r:'C',q:'maj7'},{r:'A',q:'m7'}],
  ],
};

// ============================================================
// GENRES — барабаны громче, слоёв больше
// ============================================================
const GENRES = {
  chillhop: {
    label: 'Chillhop', bpm: [72, 82], masterFilter: 4200, satur: 0.05,
    reverbDecay: 2.2, reverbWet: 0.35, chorusWet: 0.25, chorusRate: 1.2,
    padVol: -20, padAttack: 1.2, padRelease: 3.0,
    bassVol: -12, melVol: -20, melDelay: 0.3,
    kickVol: -8, snareVol: -14, hatVol: -22, shakerVol: -26, openHatVol: -24, rimVol: -20,
    drumDensity: 0.95, melDensity: 0.55, arpChance: 0.25, swing: 0.15,
  },
  jazzhop: {
    label: 'Jazzhop', bpm: [80, 90], masterFilter: 4400, satur: 0.06,
    reverbDecay: 2.0, reverbWet: 0.30, chorusWet: 0.20, chorusRate: 1.5,
    padVol: -19, padAttack: 1.0, padRelease: 2.5,
    bassVol: -11, melVol: -18, melDelay: 0.25,
    kickVol: -7, snareVol: -13, hatVol: -20, shakerVol: -24, openHatVol: -22, rimVol: -18,
    drumDensity: 1.0, melDensity: 0.7, arpChance: 0.35, swing: 0.2,
  },
  ambient: {
    label: 'Ambient', bpm: [55, 65], masterFilter: 3200, satur: 0.03,
    reverbDecay: 4.5, reverbWet: 0.55, chorusWet: 0.4, chorusRate: 0.6,
    padVol: -16, padAttack: 2.5, padRelease: 5.0,
    bassVol: -16, melVol: -24, melDelay: 0.45,
    kickVol: -18, snareVol: -26, hatVol: -32, shakerVol: -34, openHatVol: -32, rimVol: -30,
    drumDensity: 0.25, melDensity: 0.28, arpChance: 0.15, swing: 0.05,
  },
  sleepy: {
    label: 'Sleepy', bpm: [62, 72], masterFilter: 3600, satur: 0.04,
    reverbDecay: 3.2, reverbWet: 0.45, chorusWet: 0.3, chorusRate: 0.9,
    padVol: -19, padAttack: 2.0, padRelease: 4.0,
    bassVol: -15, melVol: -22, melDelay: 0.4,
    kickVol: -12, snareVol: -19, hatVol: -26, shakerVol: -30, openHatVol: -28, rimVol: -24,
    drumDensity: 0.6, melDensity: 0.42, arpChance: 0.2, swing: 0.1,
  },
};

// ============================================================
// STATE
// ============================================================
let engine = null;
let session = null;
let playing = false;
let transitioning = false;
let repeatId = null;
let motif = null;
let motifBars = 0;
let elapsedStart = 0;
let elapsedAccum = 0;
let volume = 0.65;
let muted = false;
const state = { currentGenre: 'chillhop' };

// ============================================================
// CRACKLE BUFFER
// ============================================================
function makeCrackleBuffer() {
  const sr = Tone.context.sampleRate;
  const len = Math.floor(sr * 4);
  const buf = Tone.context.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    d[i] = Math.random() < 0.0003
      ? (Math.random() * 2 - 1) * 0.4
      : (Math.random() * 2 - 1) * 0.002;
  }
  return buf;
}

// ============================================================
// ENGINE
// ============================================================
class LofiEngine {
  constructor(genre) {
    this.genre = genre;
    this.cfg = GENRES[genre];
    this.build();
  }

  build() {
    const c = this.cfg;
    const n = this.nodes = {};

    // Master: filter → soft satur → compressor → gain → limiter → destination
    n.limiter = new Tone.Limiter(-2).toDestination();
    n.masterGain = new Tone.Gain(0.6).connect(n.limiter);
    n.comp = new Tone.Compressor({ threshold: -20, ratio: 3, attack: 0.02, release: 0.25 }).connect(n.masterGain);
    n.satur = new Tone.Chebyshev({ order: 1, wet: c.satur }).connect(n.comp);
    n.filter = new Tone.Filter({ frequency: c.masterFilter, type: 'lowpass', rolloff: -24, Q: 0.3 }).connect(n.satur);

    // Reverb send
    n.reverb = new Tone.Reverb({ decay: c.reverbDecay, wet: 1, preDelay: 0.02 }).connect(n.filter);
    n.reverbSend = new Tone.Gain(c.reverbWet).connect(n.reverb);

    // ============ PAD ============
    n.chorus = new Tone.Chorus({ frequency: c.chorusRate, delayTime: 3.5, depth: 0.7, wet: c.chorusWet }).start();
    n.chorus.connect(n.filter);
    n.chorus.connect(n.reverbSend);

    n.padFilter = new Tone.Filter({ frequency: 2200, type: 'lowpass', rolloff: -12, Q: 0.4 }).connect(n.chorus);

    n.pad = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'sine' },
      envelope: { attack: c.padAttack, decay: 0.8, sustain: 0.7, release: c.padRelease }
    }).connect(n.padFilter);
    n.pad.volume.value = c.padVol;
    n.pad.set({ detune: -4 });

    // ============ BASS ============
    n.bass = new Tone.MonoSynth({
      oscillator: { type: 'sine' },
      filter: { Q: 0.4, type: 'lowpass', frequency: 180 },
      filterEnvelope: { attack: 0.02, decay: 0.2, sustain: 0.2, release: 0.3, baseFrequency: 80, octaves: 1 },
      envelope: { attack: 0.05, decay: 0.3, sustain: 0.5, release: 0.5 },
      portamento: 0.04
    }).connect(n.filter);
    n.bass.volume.value = c.bassVol;

    // ============ MELODY ============
    n.melDelay = new Tone.FeedbackDelay({ delayTime: 0.14, feedback: 0.15, wet: c.melDelay }).connect(n.filter);
    n.melFilter = new Tone.Filter({ frequency: 2400, type: 'lowpass', rolloff: -12, Q: 0.4 }).connect(n.melDelay);

    n.melody = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'sine' },
      envelope: { attack: 0.015, decay: 0.35, sustain: 0.12, release: 0.8 },
      portamento: 0.02
    }).connect(n.melFilter);
    n.melody.volume.value = c.melVol;

    // ============ DRUMS ============
    n.kick = new Tone.MembraneSynth({
      pitchDecay: 0.02, octaves: 2,
      envelope: { attack: 0.005, decay: 0.45, sustain: 0.01, release: 0.6 }
    }).connect(n.filter);
    n.kick.volume.value = c.kickVol;

    n.snareFilter = new Tone.Filter({ frequency: 1300, type: 'bandpass', Q: 0.8 }).connect(n.filter);
    n.snare = new Tone.NoiseSynth({
      noise: { type: 'brown' },
      envelope: { attack: 0.003, decay: 0.12, sustain: 0 }
    }).connect(n.snareFilter);
    n.snare.volume.value = c.snareVol;
    n.snare.connect(n.reverbSend);

    // Closed hat — 16-е
    n.hatFilter = new Tone.Filter({ frequency: 7000, type: 'highpass' }).connect(n.filter);
    n.hat = new Tone.NoiseSynth({
      noise: { type: 'white' },
      envelope: { attack: 0.002, decay: 0.03, sustain: 0 }
    }).connect(n.hatFilter);
    n.hat.volume.value = c.hatVol;

    // Open hat — на off-beats
    n.openHatFilter = new Tone.Filter({ frequency: 6000, type: 'highpass' }).connect(n.filter);
    n.openHat = new Tone.NoiseSynth({
      noise: { type: 'white' },
      envelope: { attack: 0.002, decay: 0.15, sustain: 0.02, release: 0.1 }
    }).connect(n.openHatFilter);
    n.openHat.volume.value = c.openHatVol;

    // Shaker — 16-е мягкие
    n.shakerFilter = new Tone.Filter({ frequency: 8500, type: 'highpass' }).connect(n.filter);
    n.shaker = new Tone.NoiseSynth({
      noise: { type: 'pink' },
      envelope: { attack: 0.001, decay: 0.02, sustain: 0 }
    }).connect(n.shakerFilter);
    n.shaker.volume.value = c.shakerVol;

    // Rim — щелчок на 4-й доле
    n.rimFilter = new Tone.Filter({ frequency: 2200, type: 'bandpass', Q: 4 }).connect(n.filter);
    n.rim = new Tone.MembraneSynth({
      pitchDecay: 0.01, octaves: 1,
      envelope: { attack: 0.001, decay: 0.06, sustain: 0 }
    }).connect(n.rimFilter);
    n.rim.volume.value = c.rimVol;

    // Vinyl crackle
    n.vinyl = new Tone.Player({ url: new Tone.ToneAudioBuffer(makeCrackleBuffer()), loop: true }).connect(n.filter);
    n.vinyl.volume.value = -22;
  }

  startVinyl() {
    if (this.nodes.vinyl && this.nodes.vinyl.state !== 'started') {
      try { this.nodes.vinyl.start(); } catch(e) {}
    }
  }
  stopVinyl() {
    if (this.nodes.vinyl) try { this.nodes.vinyl.stop(); } catch(e) {}
  }
  dispose() {
    try { this.stopVinyl(); } catch(e) {}
    Object.values(this.nodes).forEach(n => {
      if (n && typeof n.dispose === 'function') { try { n.dispose(); } catch(e) {} }
    });
    this.nodes = {};
  }
}

// ============================================================
// SESSION
// ============================================================
function createSession(genre) {
  const cfg = GENRES[genre];
  const bpm = Math.round(rand(cfg.bpm[0], cfg.bpm[1]));
  const key = pick(ALL_KEYS);
  const keyShift = (KEY_MIDI[key] - KEY_MIDI['C'] + 12) % 12;
  const progression = pick(PROGRESSIONS[genre]);
  const voicings = [];
  let prevMidi = null;

  for (const chord of progression) {
    const rootMidi = KEY_MIDI[chord.r] + keyShift;
    let notes = CHORD_TONES[chord.q].map(i => rootMidi + i);
    while (Math.min(...notes) < 55) notes = notes.map(x => x + 12);
    while (Math.max(...notes) > 76) notes = notes.map(x => x - 12);

    if (prevMidi) {
      let best = notes, bestCost = Infinity;
      for (const oct of [-12, 0, 12]) {
        const test = notes.map(x => x + oct);
        if (Math.min(...test) < 48 || Math.max(...test) > 80) continue;
        const cost = test.reduce((s, x) => s + Math.min(...prevMidi.map(p => Math.abs(p - x))), 0);
        if (cost < bestCost) { bestCost = cost; best = test; }
      }
      notes = best;
    }

    const chordRoot = ALL_KEYS[(KEY_MIDI[chord.r] + keyShift) % 12];
    voicings.push({
      name: chordRoot + chord.q,
      midi: notes,
      notes: notes.map(m => Tone.Frequency(m, 'midi').toNote()),
      bassMidi: Math.min(...notes) - 24,
    });
    prevMidi = notes;
  }

  return {
    genre, bpm, key, keyShift, progression, voicings,
    barCount: 0,
    maxBars: 64 + Math.floor(Math.random() * 32),
    mode: pick(['minor', 'major']),
  };
}

// Секции — 64-тактовый цикл с развитием
function getSection(bar) {
  const cycle = bar % 64;
  if (cycle < 8) return 'intro';
  if (cycle < 24) return 'verse';
  if (cycle < 40) return 'chorus';
  if (cycle < 48) return 'break';
  if (cycle < 56) return 'chorus2';
  return 'outro';
}

// ============================================================
// MELODY
// ============================================================
function generateMelody(sess, chord) {
  const rootMidi = KEY_MIDI[sess.key] + sess.keyShift;
  const penta = sess.mode === 'minor' ? [0,3,5,7,10] : [0,2,4,7,9];
  const range = [];
  for (let oct = -1; oct <= 1; oct++) {
    for (const s of penta) {
      const m = rootMidi + s + oct * 12;
      if (m >= 62 && m <= 76) range.push(m);
    }
  }
  range.sort((a, b) => a - b);
  if (!range.length) return [];

  const chordInRange = chord.midi.filter(m => m >= 62 && m <= 76);
  let cur = chordInRange.length ? pick(chordInRange) : range[Math.floor(range.length / 2)];

  const count = 2 + Math.floor(Math.random() * 3);
  const phrase = [];
  for (let i = 0; i < count; i++) {
    phrase.push({ midi: cur, beat: i * 0.5 });
    const idx = range.indexOf(cur);
    if (idx >= 0) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const step = Math.random() < 0.75 ? 1 : 2;
      cur = range[Math.max(0, Math.min(range.length - 1, idx + dir * step))];
    }
  }

  if (chordInRange.length) {
    const last = phrase[phrase.length - 1];
    let best = chordInRange[0], bestD = Infinity;
    for (const ct of chordInRange) {
      const d = Math.abs(ct - last.midi);
      if (d < bestD) { bestD = d; best = ct; }
    }
    last.midi = best;
  }
  return phrase;
}

// ============================================================
// SCHEDULER
// ============================================================
function scheduleBar(time) {
  if (!engine || !session) return;
  const cfg = GENRES[session.genre];
  const bar = session.barCount++;
  const chord = session.voicings[bar % session.voicings.length];
  const beat = 60 / session.bpm;
  const n = engine.nodes;
  const section = getSection(bar);

  if (bar > 0 && bar >= session.maxBars) {
    setTimeout(() => autoTransition(), 100);
    return;
  }

  $('npMeta').textContent = `${session.key} · ${chord.name} · ${section}`;

  const drumsOn = section === 'verse' || section === 'chorus' || section === 'chorus2';
  const fullDrums = section === 'chorus' || section === 'chorus2';
  const padOn = section !== 'outro';
  const bassOn = section !== 'intro' || Math.random() < 0.5;
  const melodyOn = fullDrums || section === 'break';

  // === PAD ===
  if (padOn) {
    if (Math.random() < cfg.arpChance && fullDrums) {
      chord.notes.forEach((note, i) => {
        n.pad.triggerAttackRelease(note, '2n', time + i * 0.04, 0.42);
      });
    } else {
      n.pad.triggerAttackRelease(chord.notes, '1m', time, 0.48);
    }
  }

  // === BASS ===
  if (bassOn) {
    const bassNote = Tone.Frequency(chord.bassMidi, 'midi').toNote();
    n.bass.triggerAttackRelease(bassNote, '2n', time + rand(0, 0.02));
    if (Math.random() < 0.5) {
      n.bass.triggerAttackRelease(bassNote, '4n', time + beat * 2.5 + rand(0, 0.03));
    }
    if (fullDrums && Math.random() < 0.4) {
      n.bass.triggerAttackRelease(bassNote, '8n', time + beat * 3.75 + rand(0, 0.02));
    }
  }

  // === DRUMS ===
  if (drumsOn && Math.random() < cfg.drumDensity) {

    // KICK
    n.kick.triggerAttackRelease('C1', '8n', time + rand(-0.008, 0.008));
    if (Math.random() < 0.7) n.kick.triggerAttackRelease('C1', '8n', time + beat * 1.75 + rand(-0.012, 0.012));
    if (Math.random() < 0.5) n.kick.triggerAttackRelease('C1', '8n', time + beat * 2.5 + rand(-0.012, 0.012));
    if (fullDrums && Math.random() < 0.3) n.kick.triggerAttackRelease('C1', '8n', time + beat * 3.5 + rand(-0.012, 0.012));

    // SNARE on 2 & 4 + ghosts
    n.snare.triggerAttackRelease('16n', time + beat + rand(-0.012, 0.012), 0.7);
    n.snare.triggerAttackRelease('16n', time + beat * 3 + rand(-0.012, 0.012), 0.75);
    // Ghost snares
    if (fullDrums) {
      if (Math.random() < 0.4) n.snare.triggerAttackRelease('32n', time + beat * 1.75 + rand(-0.01, 0.01), 0.15);
      if (Math.random() < 0.4) n.snare.triggerAttackRelease('32n', time + beat * 2.75 + rand(-0.01, 0.01), 0.18);
      if (Math.random() < 0.3) n.snare.triggerAttackRelease('32n', time + beat * 3.75 + rand(-0.01, 0.01), 0.12);
    }

    // HATS — 16-е с акцентами
    for (let i = 0; i < 16; i++) {
      const isEighth = i % 2 === 0;
      const isOffEighth = i % 4 === 2;
      const swingOff = isOffEighth ? beat * cfg.swing * 0.5 : 0;
      const vel = isEighth ? 0.45 : 0.22;
      if (fullDrums || Math.random() < 0.75) {
        n.hat.triggerAttackRelease('32n', time + (i * beat) / 4 + swingOff + rand(-0.005, 0.005), vel);
      }
    }

    // OPEN HAT на 2.5 / 4.5 (off-beat)
    if (fullDrums && Math.random() < 0.5) {
      n.openHat.triggerAttackRelease('8n', time + beat * 1.5 + rand(-0.01, 0.01), 0.5);
    }
    if (fullDrums && Math.random() < 0.35) {
      n.openHat.triggerAttackRelease('8n', time + beat * 3.5 + rand(-0.01, 0.01), 0.45);
    }

    // SHAKER — 16-е постоянно на второй половине
    if (fullDrums) {
      for (let i = 0; i < 16; i++) {
        if (Math.random() < 0.4) {
          n.shaker.triggerAttackRelease('32n', time + (i * beat) / 4 + rand(-0.005, 0.005), 0.3);
        }
      }
    }

    // RIM на 3.5 (ghost accent)
    if (fullDrums && Math.random() < 0.25) {
      n.rim.triggerAttackRelease('C4', '32n', time + beat * 3.5 + rand(-0.01, 0.01), 0.4);
    }
  }

  // === MELODY ===
  if (melodyOn && Math.random() < cfg.melDensity) {
    let phrase;
    if (motif && motifBars < 2 && Math.random() < 0.55) {
      phrase = motif.map(p => ({
        midi: p.midi + (Math.random() < 0.08 ? pick([-2, -1, 1, 2]) : 0),
        beat: p.beat,
      }));
      motifBars++;
    } else {
      phrase = generateMelody(session, chord);
      motif = phrase.map(p => ({ midi: p.midi, beat: p.beat }));
      motifBars = 0;
    }
    for (const note of phrase) {
      const swingOff = (Math.floor(note.beat * 2) % 2 === 1) ? beat * cfg.swing * 0.5 : 0;
      const dur = Math.random() < 0.8 ? '16n' : '8n';
      const noteName = Tone.Frequency(note.midi, 'midi').toNote();
      const octaveUp = Tone.Frequency(note.midi + 12, 'midi').toNote();
      n.melody.triggerAttackRelease(noteName, dur, time + note.beat * beat + swingOff + rand(-0.01, 0.01), 0.55);
      // Octave double — тише, добавляет «звонкости»
      n.melody.triggerAttackRelease(octaveUp, dur, time + note.beat * beat + swingOff + rand(-0.01, 0.01), 0.18);
    }
  }
}

// ============================================================
// PLAYBACK
// ============================================================
async function startPlaying() {
  await Tone.start();
  if (!engine) engine = new LofiEngine(state.currentGenre);
  if (!session) {
    session = createSession(state.currentGenre);
    Tone.Transport.bpm.value = session.bpm;
  }
  engine.startVinyl();
  Tone.Transport.cancel();
  if (repeatId !== null) Tone.Transport.clear(repeatId);
  repeatId = Tone.Transport.scheduleRepeat(time => {
    try { scheduleBar(time); } catch(e) { console.error(e); }
  }, '1m');
  Tone.Transport.stop();
  Tone.Transport.position = 0;
  Tone.Transport.start('+0.1');
  playing = true;
  elapsedStart = Date.now();
  updatePlayUI();
  tg?.HapticFeedback?.impactOccurred('medium');
}

function pausePlaying() {
  playing = false;
  Tone.Transport.pause();
  engine?.stopVinyl();
  elapsedAccum += (Date.now() - elapsedStart) / 1000;
  updatePlayUI();
}

async function resumePlaying() {
  await Tone.start();
  engine?.startVinyl();
  Tone.Transport.start();
  playing = true;
  elapsedStart = Date.now();
  updatePlayUI();
}

async function togglePlay() {
  try {
    if (playing) pausePlaying();
    else if (session && engine) await resumePlaying();
    else await startPlaying();
    tg?.HapticFeedback?.impactOccurred('light');
  } catch (e) {
    console.error(e);
    $('footerInfo').textContent = 'ошибка: ' + e.message;
  }
}

async function autoTransition() {
  if (transitioning) return;
  transitioning = true;
  const n = engine?.nodes;
  if (n?.masterGain) n.masterGain.gain.rampTo(0, 2.0);
  await new Promise(r => setTimeout(r, 2200));
  Tone.Transport.stop();
  Tone.Transport.cancel();
  engine?.dispose();
  engine = new LofiEngine(state.currentGenre);
  session = createSession(state.currentGenre);
  Tone.Transport.bpm.value = session.bpm;
  repeatId = Tone.Transport.scheduleRepeat(time => {
    try { scheduleBar(time); } catch(e) { console.error(e); }
  }, '1m');
  Tone.Transport.position = 0;
  engine.startVinyl();
  engine.nodes.masterGain.gain.value = 0;
  Tone.Transport.start('+0.1');
  engine.nodes.masterGain.gain.rampTo(0.6, 1.8);
  transitioning = false;
}

async function nextTrack() {
  if (!playing) { await startPlaying(); return; }
  await autoTransition();
  tg?.HapticFeedback?.impactOccurred('rigid');
}

async function changeGenre(genre) {
  if (state.currentGenre === genre) return;
  state.currentGenre = genre;
  renderGenres();
  if (!playing) return;

  const n = engine?.nodes;
  if (n?.masterGain) n.masterGain.gain.rampTo(0, 1.5);
  await new Promise(r => setTimeout(r, 1700));
  Tone.Transport.stop();
  Tone.Transport.cancel();
  engine?.dispose();
  engine = new LofiEngine(genre);
  session = createSession(genre);
  Tone.Transport.bpm.value = session.bpm;
  repeatId = Tone.Transport.scheduleRepeat(time => {
    try { scheduleBar(time); } catch(e) { console.error(e); }
  }, '1m');
  Tone.Transport.position = 0;
  engine.startVinyl();
  engine.nodes.masterGain.gain.value = 0;
  Tone.Transport.start('+0.1');
  engine.nodes.masterGain.gain.rampTo(0.6, 1.5);
  tg?.HapticFeedback?.selectionChanged();
}

// ============================================================
// UI
// ============================================================
function updatePlayUI() {
  $('vinyl').classList.toggle('spinning', playing);
  $('glow').classList.toggle('active', playing);
  document.querySelector('.icon-play').style.display = playing ? 'none' : 'block';
  document.querySelector('.icon-pause').style.display = playing ? 'block' : 'none';
  $('footerInfo').textContent = playing ? 'generating' : 'paused';
  if (playing && session) $('npTitle').textContent = session.genre + ' session';
  else $('npTitle').textContent = 'Press play';
}

function renderGenres() {
  const wrap = $('genresWrap');
  wrap.innerHTML = '';
  Object.entries(GENRES).forEach(([id, g]) => {
    const btn = document.createElement('button');
    btn.className = 'genre' + (id === state.currentGenre ? ' active' : '');
    btn.textContent = g.label;
    btn.addEventListener('click', () => changeGenre(id));
    wrap.appendChild(btn);
  });
}

// ============================================================
// THEME
// ============================================================
let theme = 'night';
$('themeBtn').addEventListener('click', () => {
  theme = theme === 'night' ? 'day' : 'night';
  document.documentElement.setAttribute('data-theme', theme);
  $('themeBtn').textContent = theme === 'night' ? '🌙' : '☀️';
});

// ============================================================
// WIRE UP
// ============================================================
$('playBtn').addEventListener('click', togglePlay);
$('nextBtn').addEventListener('click', nextTrack);
$('shuffleBtn').addEventListener('click', async () => {
  const others = Object.keys(GENRES).filter(g => g !== state.currentGenre);
  await changeGenre(pick(others));
});

$('volumeSlider').addEventListener('input', e => {
  volume = parseInt(e.target.value, 10) / 100;
  if (engine?.nodes?.masterGain && !muted) {
    engine.nodes.masterGain.gain.rampTo(volume, 0.05);
  }
});

$('muteBtn').addEventListener('click', () => {
  muted = !muted;
  $('muteBtn').classList.toggle('muted', muted);
  if (engine?.nodes?.masterGain) {
    engine.nodes.masterGain.gain.rampTo(muted ? 0 : volume, 0.1);
  }
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
    e.preventDefault(); togglePlay();
  }
});

setInterval(() => {
  let t = elapsedAccum;
  if (playing) t += (Date.now() - elapsedStart) / 1000;
  const m = Math.floor(t / 60).toString().padStart(2, '0');
  const s = Math.floor(t % 60).toString().padStart(2, '0');
  $('elapsed').textContent = `${m}:${s}`;
}, 500);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && playing && Tone.context.state === 'suspended') {
    Tone.context.resume().catch(() => {});
  }
});

renderGenres();
$('footerInfo').textContent = 'ready';
</script>
