
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight FM</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090b14;
  --panel: #111522;
  --text: #e8e8f1;
  --muted: #858ba5;
  --accent: #aaa2ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px;
  display: flex; justify-content: center; align-items: center;
  background: radial-gradient(ellipse at 50% 0%, #222440, var(--bg) 68%);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
}
.app { width: min(100%, 560px); }
header { text-align: center; margin-bottom: 25px; }
.logo { font-size: 11px; letter-spacing: 5px; color: var(--accent); }
h1 { font-weight: 300; font-size: clamp(34px, 8vw, 48px); letter-spacing: 2px; margin: 12px 0 7px; }
.subtitle { font-size: 13px; color: var(--muted); }
.scene {
  height: 190px; position: relative; overflow: hidden;
  border-radius: 12px; margin-bottom: 16px;
  background: linear-gradient(#171a32, #30314b 65%, #151827);
}
.moon {
  position: absolute; width: 52px; height: 52px; top: 25px; right: 20%;
  border-radius: 50%; background: #e5e1ff;
  box-shadow: 0 0 38px #b1a8ff55;
}
.skyline {
  position: absolute; inset: auto 0 0; height: 105px;
  display: flex; align-items: end; justify-content: space-around; gap: 4px;
}
.building { flex: 1; max-width: 58px; background: #101321; position: relative; }
.building:after {
  content: ""; position: absolute; inset: 10px 7px;
  background: repeating-linear-gradient(0deg, transparent 0 10px, #aaa5e525 10px 13px);
}
.now {
  padding: 21px 16px; text-align: center; background: var(--panel);
  border: 1px solid #ffffff0d; border-radius: 12px; margin-bottom: 12px;
}
.label { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
#trackName { font-size: 19px; margin-top: 9px; }
#trackDesc { font-size: 12px; color: var(--muted); margin-top: 5px; }
.controls {
  background: var(--panel); border: 1px solid #ffffff0d;
  border-radius: 12px; padding: 20px;
}
button {
  width: 100%; border: 0; border-radius: 8px; padding: 14px;
  font: inherit; font-weight: 600; cursor: pointer;
  color: #111323; background: var(--accent);
}
button:disabled { opacity: .6; cursor: wait; }
.volume { margin-top: 17px; }
.volume-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
input { width: 100%; margin-top: 9px; accent-color: var(--accent); }
#status { text-align: center; color: var(--muted); font-size: 11px; margin-top: 15px; min-height: 14px; }
footer { text-align: center; color: #686e86; font-size: 10px; letter-spacing: 2px; margin-top: 18px; }
@media(max-width:430px) { body { padding: 14px; } .scene { height: 160px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">INDEPENDENT RADIO</div>
    <h1>Midnight FM</h1>
    <div class="subtitle">somewhere between yesterday and tomorrow</div>
  </header>

  <div class="scene" aria-hidden="true">
    <div class="moon"></div>
    <div class="skyline">
      <div class="building" style="height:48%"></div>
      <div class="building" style="height:76%"></div>
      <div class="building" style="height:57%"></div>
      <div class="building" style="height:90%"></div>
      <div class="building" style="height:64%"></div>
      <div class="building" style="height:80%"></div>
      <div class="building" style="height:52%"></div>
      <div class="building" style="height:68%"></div>
      <div class="building" style="height:43%"></div>
    </div>
  </div>

  <div class="now">
    <div class="label">NOW PLAYING</div>
    <div id="trackName">Midnight memories</div>
    <div id="trackDesc">a little music for the hours that belong to you</div>
  </div>

  <div class="controls">
    <button id="toggle">▶ Start radio</button>
    <div class="volume">
      <div class="volume-head"><label for="volume">Volume</label><span id="volumeValue">70%</span></div>
      <input id="volume" type="range" min="0" max="100" value="70">
    </div>
    <div id="status">Radio is sleeping.</div>
  </div>
  <footer>24 HOURS · AFTER DARK · ALWAYS ON</footer>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const TITLES = [
    ["Midnight memories", "somewhere you used to know"],
    ["Rain on the window", "the city never really sleeps"],
    ["Last train home", "one more stop before tomorrow"],
    ["Blue hour", "nothing urgent, nowhere to be"],
    ["Empty streets", "let the night take its time"],
    ["Almost morning", "just a little longer"],
    ["Distant lights", "the world feels softer from here"],
    ["After the rain", "everything is quiet again"],
    ["No destination", "it's about the road, not the end"],
    ["Sleepless", "thoughts drifting past the window"],
    ["Neon dreams", "somewhere far from the noise"],
    ["Slow motion", "there's no need to hurry"]
  ];

  let ctx = null;
  let master = null;
  let musicBus = null;
  let ambientBus = null;
  let ambientSource = null;
  let ambientBuffer = null;
  let playing = false;
  let schedulerTimer = null;
  let nextTime = 0;
  let step = 0;
  let bar = 0;
  let bpm = 72;
  let swing = 0.06;
  let keyRoot = 45;
  let scale = [];
  let progression = [];
  let barData = null;
  let nextBarAt = 0;
  let arrangementBars = 0;
  let groove = null;
  let lastTitle = -1;

  const active = new Set();

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function chance(p) { return Math.random() < p; }

  function status(text) { $("status").textContent = text; }

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("Web Audio is not supported");
    ctx = new AC();

    master = ctx.createGain();
    musicBus = ctx.createGain();
    ambientBus = ctx.createGain();

    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -20;
    compressor.knee.value = 18;
    compressor.ratio.value = 3;
    compressor.attack.value = 0.012;
    compressor.release.value = 0.25;

    musicBus.connect(master);
    ambientBus.connect(master);
    master.connect(compressor);
    compressor.connect(ctx.destination);
    setVolume();
  }

  function setVolume() {
    const v = Number($("volume").value) / 100;
    $("volumeValue").textContent = Math.round(v * 100) + "%";
    if (master && ctx) {
      master.gain.setTargetAtTime(v, ctx.currentTime, 0.08);
    }
  }

  async function loadAmbience() {
    if (ambientBuffer) return;
    const response = await fetch("Presets/ambience.mp3");
    if (!response.ok) throw new Error("Couldn't load Presets/ambience.mp3");
    ambientBuffer = await ctx.decodeAudioData(await response.arrayBuffer());
  }

  function makeTitle() {
    let i = Math.floor(Math.random() * TITLES.length);
    if (i === lastTitle) i = (i + 1) % TITLES.length;
    lastTitle = i;
    $("trackName").textContent = TITLES[i][0];
    $("trackDesc").textContent = TITLES[i][1];
  }

  function chooseScale() {
    // Minor pentatonic: reliably mellow, with room for melodic variation.
    scale = [0, 3, 5, 7, 10];
    keyRoot = pick([43, 45, 48, 50, 52, 55]);
  }

  function newArrangement() {
    bpm = pick([66, 68, 70, 72, 74, 76, 78, 80]);
    swing = rand(0.015, 0.14);
    chooseScale();

    progression = pick([
      [0, 3, 5, 4],
      [0, 5, 3, 4],
      [0, 3, 1, 4],
      [0, 4, 5, 3],
      [5, 3, 0, 4],
      [0, 2, 5, 4],
      [0, 4, 1, 3],
      [3, 5, 0, 4]
    ]);

    groove = {
      drums: pick(["soft", "dusty", "sparse", "steady", "broken"]),
      bass: pick(["root", "walking", "sparse"]),
      piano: pick(["open", "arpeggio", "fragments", "call-response"]),
      density: pick([0.48, 0.62, 0.72, 0.82]),
      velocity: rand(0.75, 1.1)
    };

    arrangementBars = 0;
    makeTitle();
    status("On air · " + bpm + " BPM");
  }

  function midiHz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  function track(node) {
    active.add(node);
    node.addEventListener("ended", () => active.delete(node), { once: true });
  }

  function pluck(midi, when, duration, velocity, pan = 0) {
    const f = midiHz(midi);
    const voice = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    const stereo = ctx.createStereoPanner();
    const fundamental = ctx.createOscillator();
    const harmonic = ctx.createOscillator();
    const body = ctx.createGain();
    const shimmer = ctx.createGain();

    fundamental.type = "triangle";
    fundamental.frequency.setValueAtTime(f, when);
    harmonic.type = "sine";
    harmonic.frequency.setValueAtTime(f * 2.003, when);

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(rand(1300, 2400), when);
    filter.frequency.exponentialRampToValueAtTime(700, when + duration);

    body.gain.value = 0.78;
    shimmer.gain.value = 0.22;

    voice.gain.setValueAtTime(0.0001, when);
    voice.gain.linearRampToValueAtTime(velocity, when + 0.012);
    voice.gain.exponentialRampToValueAtTime(0.0001, when + duration);

    stereo.pan.setValueAtTime(pan, when);
    fundamental.connect(body);
    harmonic.connect(shimmer);
    body.connect(filter);
    shimmer.connect(filter);
    filter.connect(voice);
    voice.connect(stereo);
    stereo.connect(musicBus);

    fundamental.start(when);
    harmonic.start(when);
    fundamental.stop(when + duration + 0.03);
    harmonic.stop(when + duration + 0.03);
    track(fundamental);
    track(harmonic);

    fundamental.onended = () => {
      fundamental.disconnect(); harmonic.disconnect();
      body.disconnect(); shimmer.disconnect();
      filter.disconnect(); voice.disconnect(); stereo.disconnect();
    };
  }

  function bassNote(midi, when, duration, velocity) {
    const osc = ctx.createOscillator();
    const sub = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    osc.type = "triangle";
    sub.type = "sine";
    osc.frequency.setValueAtTime(midiHz(midi), when);
    sub.frequency.setValueAtTime(midiHz(midi), when);
    filter.type = "lowpass";
    filter.frequency.value = 180;

    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(velocity, when + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);

    osc.connect(filter);
    sub.connect(filter);
    filter.connect(gain);
    gain.connect(musicBus);
    osc.start(when); sub.start(when);
    osc.stop(when + duration + 0.03);
    sub.stop(when + duration + 0.03);
    track(osc); track(sub);
    osc.onended = () => {
      osc.disconnect(); sub.disconnect(); filter.disconnect(); gain.disconnect();
    };
  }

  function kick(when, volume = 0.12) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(100, when);
    osc.frequency.exponentialRampToValueAtTime(42, when + 0.13);
    gain.gain.setValueAtTime(volume, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.17);
    osc.connect(gain); gain.connect(musicBus);
    osc.start(when); osc.stop(when + 0.18);
    track(osc);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  }

  function noiseHit(when, kind, volume) {
    const duration = kind === "hat" ? 0.045 : 0.12;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    }

    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    src.buffer = buffer;
    filter.type = kind === "hat" ? "highpass" : "bandpass";
    filter.frequency.value = kind === "hat" ? 6500 : 1900;
    gain.gain.setValueAtTime(volume, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    src.connect(filter); filter.connect(gain); gain.connect(musicBus);
    src.start(when);
    track(src);
    src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
  }

  function makeBarData() {
    const chord = progression[bar % progression.length];
    const chordRoot = keyRoot + scale[chord % scale.length];
    const chordNotes = [
      chordRoot + 12,
      chordRoot + 12 + scale[2],
      chordRoot + 12 + scale[4],
      chordRoot + 24
    ];
    const notes = [];
    const count = pick([3, 4, 5, 6, 7]);

    // Each bar gets its own phrase: new contour, rests, octave and rhythm.
    let pos = pick([0, 1, 2, 3]);
    let previous = pick(chordNotes);
    for (let i = 0; i < count; i++) {
      const movement = pick([-2, -1, 0, 1, 2, 3]);
      let candidate = previous + movement * pick([2, 3, 5]);
      candidate = Math.max(keyRoot + 12, Math.min(keyRoot + 31, candidate));
      const degree = scale.findIndex((n, ix) =>
        ix === scale.length - 1 ? candidate % 12 === (keyRoot + n) % 12 :
        candidate % 12 === (keyRoot + n) % 12
      );
      if (degree < 0) candidate = pick(chordNotes);
      if (chance(0.28)) candidate += 12;
      notes.push({
        beat: pos,
        midi: candidate,
        velocity: rand(0.035, 0.085) * groove.velocity,
        duration: rand(0.45, 1.55),
        pan: rand(-0.5, 0.5)
      });
      previous = candidate;
      pos += pick([0.5, 0.5, 1, 1, 1.5, 2]);
      if (pos >= 4) break;
    }

    return { chord, chordRoot, chordNotes, notes };
  }

  function scheduleBar(when) {
    if (arrangementBars > 0 && arrangementBars % pick([8, 12, 16]) === 0) {
      newArrangement();
    }

    barData = makeBarData();
    const beatLen = 60 / bpm;
    const barDuration = beatLen * 4;
    const barStart = when;
    const style = groove.drums;

    // Chord pads appear occasionally, never on every bar.
    if (groove.piano === "open" && chance(0.45)) {
      barData.chordNotes.slice(0, 3).forEach((n, i) => {
        pluck(n, barStart + i * 0.035, rand(1.2, 2.2), 0.018, (i - 1) * 0.35);
      });
    }

    for (const note of barData.notes) {
      if (!chance(groove.density)) continue;
      const offset = note.beat * beatLen;
      pluck(note.midi, barStart + offset, note.duration, note.velocity, note.pan);
      if (groove.piano === "arpeggio" && chance(0.35)) {
        pluck(note.midi + 12, barStart + offset + beatLen * 0.5,
          note.duration * 0.65, note.velocity * 0.55, -note.pan);
      }
    }

    // Bass changes shape with the harmony and arrangement.
    if (groove.bass !== "sparse" || chance(0.65)) {
      bassNote(barData.chordRoot - 12, barStart, beatLen * rand(1.1, 1.8), 0.055);
      if (groove.bass === "walking" && chance(0.7)) {
        const approach = barData.chordRoot - 12 + pick([2, 3, 5, 7]);
        bassNote(approach, barStart + beatLen * 2.5, beatLen * 0.7, 0.035);
      } else if (groove.bass === "root" && chance(0.55)) {
        bassNote(barData.chordRoot - 12, barStart + beatLen * 2, beatLen * 0.8, 0.04);
      }
    }

    // Variation in groove, with occasional space between beats.
    if (style !== "sparse" && chance(style === "steady" ? 0.9 : 0.7)) {
      kick(barStart, style === "soft" ? 0.07 : 0.11);
    }
    if (style !== "sparse" && chance(0.65)) kick(barStart + beatLen * 2, 0.075);

    if (style === "steady" || (style !== "sparse" && chance(0.55))) {
      noiseHit(barStart + beatLen, "snare", 0.022);
      noiseHit(barStart + beatLen * 3, "snare", 0.025);
    } else if (chance(0.25)) {
      noiseHit(barStart + beatLen * pick([1, 2, 3]), "snare", 0.018);
    }

    for (let i = 0; i < 8; i++) {
      if (chance(style === "dusty" ? 0.4 : 0.6)) {
        noiseHit(barStart + i * beatLen * 0.5, "hat", rand(0.006, 0.013));
      }
    }

    arrangementBars++;
    bar++;
    return barDuration;
  }

  function scheduler() {
    if (!playing) return;
    const horizon = ctx.currentTime + 0.18;
    while (nextTime < horizon) {
      const duration = scheduleBar(nextTime);
      nextTime += duration;
    }
  }

  async function start() {
    if (playing) return;
    $("toggle").disabled = true;
    status("Tuning in...");
    try {
      init();
      await ctx.resume();
      await loadAmbience();

      ambientSource = ctx.createBufferSource();
      ambientSource.buffer = ambientBuffer;
      ambientSource.loop = true;
      ambientSource.connect(ambientBus);
      ambientSource.start();
      ambientBus.gain.setValueAtTime(0, ctx.currentTime);
      ambientBus.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 3);

      musicBus.gain.setValueAtTime(0, ctx.currentTime);
      musicBus.gain.linearRampToValueAtTime(0.88, ctx.currentTime + 2);

      playing = true;
      bar = 0;
      arrangementBars = 0;
      newArrangement();
      nextTime = ctx.currentTime + 0.15;
      schedulerTimer = setInterval(scheduler, 30);
      $("toggle").textContent = "Ⅱ Pause radio";
      status("On air · changing melodies, endlessly");
    } catch (e) {
      console.error(e);
      status("Audio couldn't start. Check Presets/ambience.mp3.");
      playing = false;
    } finally {
      $("toggle").disabled = false;
    }
  }

  function stop() {
    playing = false;
    clearInterval(schedulerTimer);
    schedulerTimer = null;

    if (ctx) {
      const now = ctx.currentTime;
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setTargetAtTime(0, now, 0.1);
      ambientBus.gain.cancelScheduledValues(now);
      ambientBus.gain.setTargetAtTime(0, now, 0.1);
    }

    setTimeout(() => {
      if (playing) return;
      try {
        if (ambientSource) {
          ambientSource.stop();
          ambientSource.disconnect();
          ambientSource = null;
        }
        for (const node of active) {
          try { node.stop(); } catch (_) {}
        }
        active.clear();
      } catch (_) {}
    }, 500);

    $("toggle").textContent = "▶ Start radio";
    status("Radio is sleeping.");
  }

  $("toggle").addEventListener("click", () => {
    if (playing) stop();
    else start();
  });

  $("volume").addEventListener("input", setVolume);

  $("trackName").textContent = "Midnight memories";
  status("Radio is sleeping.");
})();
</script>
</body>
</html>
