
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight FM — Lo-fi Radio Lab</title>
<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: grid;
  place-items: center;
  background: #0b101c;
  color: #ece8df;
  font-family: Georgia, serif;
}

main {
  width: min(460px, 100%);
  padding: 28px;
  border: 1px solid #414354;
  border-radius: 20px;
  background: linear-gradient(160deg, #202536, #121725 75%);
  box-shadow: 0 24px 80px #0007;
}

.eyebrow {
  color: #b8a88e;
  font: 10px Arial, sans-serif;
  letter-spacing: 4px;
  text-transform: uppercase;
}

h1 {
  font-size: 29px;
  font-weight: normal;
  letter-spacing: 2px;
  margin: 12px 0 8px;
}

p {
  color: #b4b6c3;
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: 1px solid #5a6072;
  border-radius: 28px;
  background: #30384b;
  color: #f2eee6;
  font-size: 14px;
  cursor: pointer;
}

button:hover { background: #414b60; }
button:disabled { opacity: .45; cursor: wait; }

.primary {
  background: #d5c8ad;
  color: #191d28;
  border-color: transparent;
}

.controls {
  margin-top: 22px;
  padding: 16px;
  border: 1px solid #373e50;
  border-radius: 14px;
  background: #11172580;
}

.controls h2 {
  margin: 0 0 16px;
  color: #d9cdb8;
  font-size: 15px;
  font-weight: normal;
}

.slider-row { margin-top: 15px; }

.slider-heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  color: #c4c6d0;
  font: 12px Arial, sans-serif;
}

.slider-heading output {
  color: #d9cdb8;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  width: 100%;
  accent-color: #c9b99c;
  cursor: pointer;
}

#status {
  min-height: 36px;
  margin-top: 18px;
  color: #c0b49e;
  font: 12px/1.6 Arial, sans-serif;
  overflow-wrap: anywhere;
}

.small {
  margin-top: 14px;
  color: #818ba0;
  font: 11px/1.6 Arial, sans-serif;
}
</style>
</head>

<body>
<main>
  <div class="eyebrow">Midnight FM · sound lab</div>
  <h1>Warm Lo-fi Radio</h1>
  <p>
    Тёплое пианино, мягкий бас и приглушённый бит.
    Музыка создаётся на ходу.
  </p>

  <button id="load" class="primary">1. Загрузить звуки</button>
  <button id="chord" disabled>Тест: пианино</button>
  <button id="play" class="primary" disabled>▶ Запустить радио</button>
  <button id="stop" disabled>■ Остановить радио</button>

  <section class="controls">
    <h2>Микшер</h2>

    <div class="slider-row">
      <div class="slider-heading">
        <label for="pianoVol">Пианино</label>
        <output id="pianoOut">100%</output>
      </div>
      <input id="pianoVol" type="range" min="0" max="100" value="100">
    </div>

    <div class="slider-row">
      <div class="slider-heading">
        <label for="bassVol">Бас</label>
        <output id="bassOut">15%</output>
      </div>
      <input id="bassVol" type="range" min="0" max="100" value="15">
    </div>

    <div class="slider-row">
      <div class="slider-heading">
        <label for="drumsVol">Ударные</label>
        <output id="drumsOut">100%</output>
      </div>
      <input id="drumsVol" type="range" min="0" max="100" value="100">
    </div>

    <div class="slider-row">
      <div class="slider-heading">
        <label for="textureVol">Текстура записи</label>
        <output id="textureOut">15%</output>
      </div>
      <input id="textureVol" type="range" min="0" max="100" value="15">
    </div>
  </section>

  <div id="status">Сначала загрузи звуки.</div>
  <div class="small">
    72 BPM · уютная минорная гармония · развивающиеся мелодии ·
    мягкий бит · независимая громкость слоёв.
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const loadButton = $("load");
  const chordButton = $("chord");
  const playButton = $("play");
  const stopButton = $("stop");
  const status = $("status");

  let ready = false;
  let loading = false;
  let playing = false;
  let piano = null;
  let bass = null;
  let kick = null;
  let snare = null;
  let hats = null;
  let noise = null;

  let pianoGain, bassGain, drumsGain, textureGain;
  let pianoFilter, pianoCompressor, saturation, reverb;
  let noiseHighpass, noiseLowpass;
  let repeatId = null;
  let barNumber = 0;

  const effects = [];
  const BPM = 72;
  const beat = 60 / BPM;

  const progressions = [
    [
      { notes: ["C4", "D#4", "G4"], root: "C2" },
      { notes: ["C4", "G#4", "D#5"], root: "G#1" },
      { notes: ["D#4", "G4", "A#4"], root: "D#2" },
      { notes: ["A#3", "D4", "F4"], root: "A#1" }
    ],
    [
      { notes: ["C4", "D#4", "G4"], root: "C2" },
      { notes: ["A#3", "D4", "F4"], root: "A#1" },
      { notes: ["C4", "G#4", "D#5"], root: "G#1" },
      { notes: ["B3", "D4", "G4"], root: "G1" }
    ],
    [
      { notes: ["C4", "G#4", "D#5"], root: "G#1" },
      { notes: ["D#4", "G4", "A#4"], root: "D#2" },
      { notes: ["C4", "D#4", "G4"], root: "C2" },
      { notes: ["A#3", "D4", "F4"], root: "A#1" }
    ]
  ];

  const scale = [
    "C4", "D#4", "F4", "G4", "A#4",
    "C5", "D#5", "F5", "G5"
  ];

  let currentProgression = progressions[0];
  let previousNote = "G4";

  function say(message) {
    status.textContent = message;
  }

  function choose(array) {
    return array[Math.floor(Math.random() * array.length)];
  }

  function setControls() {
    chordButton.disabled = !ready || playing;
    playButton.disabled = !ready || playing;
    stopButton.disabled = !playing;
  }

  function createGain(value) {
    const gain = new Tone.Gain(value);
    gain.toDestination();
    effects.push(gain);
    return gain;
  }

  async function loadAudio() {
    if (loading || ready) return;

    if (typeof Tone === "undefined") {
      say("Tone.js не загрузился. Обнови страницу.");
      return;
    }

    loading = true;
    loadButton.disabled = true;
    say("Загружаем пианино и создаём инструменты…");

    try {
      await Tone.start();

      // Пианино: сохраняем тёплую обработку из предыдущей версии.
      pianoGain = new Tone.Gain(0.8);
      pianoFilter = new Tone.Filter({
        type: "lowpass",
        frequency: 6200,
        rolloff: -12
      });
      const pianoHighpass = new Tone.Filter({
        type: "highpass",
        frequency: 85,
        rolloff: -12
      });
      pianoCompressor = new Tone.Compressor({
        threshold: -25,
        ratio: 2,
        attack: 0.025,
        release: 0.25
      });
      saturation = new Tone.Distortion(0.07);
      saturation.wet.value = 0.16;
      reverb = new Tone.Reverb({ decay: 3.2, wet: 0.2 });

      pianoGain.connect(pianoHighpass);
      pianoHighpass.connect(pianoFilter);
      pianoFilter.connect(pianoCompressor);
      pianoCompressor.connect(saturation);
      saturation.connect(reverb);
      reverb.toDestination();

      effects.push(
        pianoGain, pianoHighpass, pianoFilter,
        pianoCompressor, saturation, reverb
      );

      await reverb.generate();

      piano = new Tone.Sampler({
        urls: {
          C3: "C3.mp3",
          "D#3": "Ds3.mp3",
          "F#3": "Fs3.mp3",
          A3: "A3.mp3",
          C4: "C4.mp3",
          "D#4": "Ds4.mp3",
          "F#4": "Fs4.mp3",
          A4: "A4.mp3",
          C5: "C5.mp3",
          "D#5": "Ds5.mp3",
          "F#5": "Fs5.mp3",
          A5: "A5.mp3",
          C6: "C6.mp3"
        },
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        attack: 0.025,
        release: 2.2
      });
      piano.connect(pianoGain);
      piano.volume.value = -4;

      // Бас: мягкий треугольный синтезатор с низким фильтром.
      bassGain = createGain(0.12);
      const bassFilter = new Tone.Filter({
        type: "lowpass",
        frequency: 155,
        rolloff: -24
      });
      bass = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: {
          attack: 0.055,
          decay: 0.28,
          sustain: 0.12,
          release: 0.32
        }
      });
      bass.connect(bassFilter);
      bassFilter.connect(bassGain);
      effects.push(bassFilter);

      // Kick: округлый и негромкий.
      drumsGain = createGain(0.35);
      kick = new Tone.MembraneSynth({
        pitchDecay: 0.04,
        octaves: 3,
        oscillator: { type: "sine" },
        envelope: {
          attack: 0.001,
          decay: 0.28,
          sustain: 0,
          release: 0.12
        }
      });
      kick.volume.value = -3;
      kick.connect(drumsGain);

      // Snare: короткий шумовой щелчок с мягким телом.
      snare = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: {
          attack: 0.002,
          decay: 0.13,
          sustain: 0,
          release: 0.025
        }
      });
      snare.volume.value = -13;
      snare.connect(drumsGain);

      // Hats: короткие и тихие металлические шорохи.
      hats = new Tone.MetalSynth({
        frequency: 220,
        envelope: {
          attack: 0.001,
          decay: 0.07,
          release: 0.01
        },
        harmonicity: 5.1,
        modulationIndex: 24,
        resonance: 3200,
        octaves: 1.5
      });
      hats.volume.value = -25;
      hats.connect(drumsGain);

      // Тихий розовый шум для ощущения старой записи.
      textureGain = createGain(0.012);
      noiseHighpass = new Tone.Filter({
        type: "highpass",
        frequency: 1800,
        rolloff: -12
      });
      noiseLowpass = new Tone.Filter({
        type: "lowpass",
        frequency: 6500
      });
      noise = new Tone.Noise("pink");
      noise.connect(noiseHighpass);
      noiseHighpass.connect(noiseLowpass);
      noiseLowpass.connect(textureGain);

      effects.push(noiseHighpass, noiseLowpass);
      noise.start();

      await Tone.loaded();

      ready = true;
      setControls();
      updateMix();
      say("Готово! Послушай пианино или запускай радио.");
    } catch (error) {
      console.error(error);
      say("Ошибка загрузки: " + error.message);
      loadButton.disabled = false;
      disposeAudio();
    } finally {
      loading = false;
    }
  }

  function updateMix() {
    const p = Number($("pianoVol").value);
    const b = Number($("bassVol").value);
    const d = Number($("drumsVol").value);
    const t = Number($("textureVol").value);

    $("pianoOut").textContent = p + "%";
    $("bassOut").textContent = b + "%";
    $("drumsOut").textContent = d + "%";
    $("textureOut").textContent = t + "%";

    if (pianoGain) pianoGain.gain.rampTo(p / 100, 0.08);
    if (bassGain) bassGain.gain.rampTo((b / 100) * 0.35, 0.08);
    if (drumsGain) drumsGain.gain.rampTo(d / 100, 0.08);
    if (textureGain) textureGain.gain.rampTo((t / 100) * 0.048, 0.08);
  }

  function testPiano() {
    if (!ready || playing) return;
    const now = Tone.now() + 0.1;

    piano.triggerAttackRelease(
      ["C4", "D#4", "G4", "A#4", "D#5"],
      4,
      now,
      0.48
    );
    piano.triggerAttackRelease(
      ["G3", "C4"],
      3.5,
      now + 0.08,
      0.24
    );
    say("Тест пианино: тёплый аккорд.");
  }

  function startRadio() {
    if (!ready || playing) return;

    try {
      Tone.Transport.stop();
      Tone.Transport.cancel();
      Tone.Transport.bpm.value = BPM;
      Tone.Transport.timeSignature = 4;

      barNumber = 0;
      previousNote = "G4";
      currentProgression = choose(progressions);

      // Событие повторяется раз в такт. Все звуки назначаются
      // по времени Transport, поэтому ритм не зависит от задержек JS.
      repeatId = Tone.Transport.scheduleRepeat((time) => {
        generateBar(time);
      }, "1m");

      playing = true;
      Tone.Transport.start("+0.1");
      setControls();
      say("Midnight FM играет: пианино, бас и мягкий бит.");
    } catch (error) {
      console.error(error);
      playing = false;
      setControls();
      say("Не удалось запустить радио: " + error.message);
    }
  }

  function generateBar(time) {
    const position = barNumber % 4;
    const phrasePosition = barNumber % 16;
    const section = Math.floor(phrasePosition / 4);

    // Гармония держится четыре такта, а обновляется раз в 16 тактов.
    // Так музыка развивается, но не перескакивает между случайными аккордами.
    if (barNumber > 0 && phrasePosition === 0) {
      currentProgression = choose(progressions);
    }

    const chord = currentProgression[position];
    const breakdown = section === 3;
    const lightSection = section === 1;

    // Аккорды: иногда полный аккорд, иногда более редкое и лёгкое звучание.
    const chordVelocity = breakdown ? 0.18 : (lightSection ? 0.21 : 0.27);
    if (!breakdown || position % 2 === 0) {
      piano.triggerAttackRelease(
        chord.notes,
        (breakdown ? 2.6 : 3.4) * beat,
        time,
        chordVelocity
      );
    }

    // Бас остаётся фоном: короткий, тёплый и не в каждом такте.
    if (!breakdown && (position === 0 || position === 2)) {
      bass.triggerAttackRelease(chord.root, "2n", time, 0.24);
    } else if (breakdown && position === 0) {
      bass.triggerAttackRelease(chord.root, "2n", time, 0.16);
    }

    // Ударные меняют плотность между частями 16-тактового цикла.
    if (!breakdown && !lightSection) {
      if (Math.random() > 0.08) {
        kick.triggerAttackRelease("C1", "8n", time, 0.42);
      }
      if (Math.random() > 0.28) {
        kick.triggerAttackRelease("C1", "8n", time + 2 * beat, 0.29);
      }
      if (Math.random() > 0.12) {
        snare.triggerAttackRelease("8n", time + beat, 0.20);
      }
      if (Math.random() > 0.15) {
        snare.triggerAttackRelease("8n", time + 3 * beat, 0.19);
      }
    } else if (lightSection) {
      // Вторая часть тише по активности: оставляем редкие акценты.
      if (position % 2 === 0) {
        kick.triggerAttackRelease("C1", "8n", time, 0.28);
      }
      if (position === 3 && Math.random() > 0.35) {
        snare.triggerAttackRelease("8n", time + 3 * beat, 0.13);
      }
    } else {
      // В конце цикла почти убираем бит, чтобы было ощущение передышки.
      if (position === 0 && Math.random() > 0.45) {
        kick.triggerAttackRelease("C1", "8n", time, 0.20);
      }
    }

    // Хэты с разной плотностью и небольшими паузами.
    const hatChance = breakdown ? 0.12 : (lightSection ? 0.24 : 0.48);
    for (let i = 0; i < 8; i++) {
      if (Math.random() < hatChance) {
        hats.triggerAttackRelease(
          "32n",
          time + i * beat / 2 + (i % 2 ? beat * 0.018 : 0),
          breakdown ? 0.055 : 0.09 + Math.random() * 0.05
        );
      }
    }

    // Мелодия строится из небольших фраз: мотив повторяется с изменениями,
    // а не выбирается полностью случайный набор нот каждый такт.
    const motifs = [
      [0, 2, 4, 2],
      [4, 3, 2, 1],
      [0, 2, 3, 4],
      [4, 2, 1, 0]
    ];
    const motif = motifs[position];
    const slotsByBar = [
      [0.5, 1.5, 2.5, 3.5],
      [0.5, 1, 2.5, 3.5],
      [1, 1.5, 2.5, 3],
      [0.5, 2, 3.5]
    ];
    const slots = slotsByBar[position];
    const chordTonePool = chord.notes.filter(note => scale.includes(note));
    const safePool = chordTonePool.length ? chordTonePool : scale;

    if (!breakdown || position % 2 === 0) {
      for (let i = 0; i < slots.length; i++) {
        // Часть нот приходит из мотива, часть — из аккорда.
        let note;
        if (i < motif.length && Math.random() < 0.68) {
          note = scale[motif[i]];
        } else {
          note = choose(safePool);
        }

        // Вариации сохраняют фразу узнаваемой, но не полностью одинаковой.
        if (Math.random() < 0.22) {
          const idx = scale.indexOf(note);
          if (idx >= 0) {
            const step = choose([-1, 1]);
            note = scale[Math.max(0, Math.min(scale.length - 1, idx + step))];
          }
        }

        if (Math.random() < (breakdown ? 0.32 : 0.12)) continue;

        const velocity = breakdown
          ? 0.10 + Math.random() * 0.05
          : (lightSection ? 0.11 + Math.random() * 0.07 : 0.14 + Math.random() * 0.10);

        piano.triggerAttackRelease(
          note,
          choose([0.45, 0.7, 1.0, 1.3]),
          time + slots[i] * beat,
          velocity
        );
        previousNote = note;
      }
    }

    // Иногда добавляем тихое арпеджио в конце такта — музыкальный ответ.
    if (!breakdown && Math.random() > 0.55) {
      const arpeggio = chord.notes;
      const note = choose(arpeggio);
      piano.triggerAttackRelease(
        note,
        "8n",
        time + 3.5 * beat,
        0.09
      );
    }

    barNumber++;
  }

  function stopRadio() {
    if (!playing) return;

    Tone.Transport.stop();
    Tone.Transport.cancel();
    repeatId = null;
    playing = false;
    setControls();
    say("Радио остановлено.");
  }

  function disposeAudio() {
    try {
      Tone.Transport.stop();
      Tone.Transport.cancel();
    } catch (_) {}

    for (const instrument of [piano, bass, kick, snare, hats, noise]) {
      if (instrument) {
        try { instrument.dispose(); } catch (_) {}
      }
    }

    for (const effect of effects) {
      try { effect.dispose(); } catch (_) {}
    }

    effects.length = 0;
    piano = bass = kick = snare = hats = noise = null;
    ready = false;
  }

  loadButton.addEventListener("click", loadAudio);
  chordButton.addEventListener("click", testPiano);
  playButton.addEventListener("click", startRadio);
  stopButton.addEventListener("click", stopRadio);

  ["pianoVol", "bassVol", "drumsVol", "textureVol"].forEach(id => {
    $(id).addEventListener("input", updateMix);
  });
})();
</script>
</body>
</html>
