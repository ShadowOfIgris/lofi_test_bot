
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight FM</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090b14;
  --panel: #111522;
  --text: #e8e8f1;
  --muted: #858ba5;
  --accent: #aaa2ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px;
  display: flex; justify-content: center; align-items: center;
  background: radial-gradient(ellipse at 50% 0%, #222440, var(--bg) 68%);
  color: var(--text); font-family: Inter, system-ui, sans-serif;
}
.app { width: min(100%, 560px); }
header { text-align: center; margin-bottom: 25px; }
.logo { font-size: 11px; letter-spacing: 5px; color: var(--accent); }
h1 { font-weight: 300; font-size: clamp(34px, 8vw, 48px); letter-spacing: 2px; margin: 12px 0 7px; }
.subtitle { font-size: 13px; color: var(--muted); }
.scene {
  height: 190px; position: relative; overflow: hidden;
  border-radius: 12px; margin-bottom: 16px;
  background: linear-gradient(#171a32, #30314b 65%, #151827);
}
.moon {
  position: absolute; width: 52px; height: 52px; top: 25px; right: 20%;
  border-radius: 50%; background: #e5e1ff;
  box-shadow: 0 0 38px #b1a8ff55;
}
.skyline {
  position: absolute; inset: auto 0 0; height: 105px;
  display: flex; align-items: end; justify-content: space-around; gap: 4px;
}
.building { flex: 1; max-width: 58px; background: #101321; position: relative; }
.building:after {
  content: ""; position: absolute; inset: 10px 7px;
  background: repeating-linear-gradient(0deg, transparent 0 10px, #aaa5e525 10px 13px);
}
.now {
  padding: 21px 16px; text-align: center; background: var(--panel);
  border: 1px solid #ffffff0d; border-radius: 12px; margin-bottom: 12px;
}
.label { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
#trackName { font-size: 19px; margin-top: 9px; }
#trackDesc { font-size: 12px; color: var(--muted); margin-top: 5px; }
.controls {
  background: var(--panel); border: 1px solid #ffffff0d;
  border-radius: 12px; padding: 20px;
}
.buttons { display: flex; gap: 10px; }
button {
  flex: 1; border: 0; border-radius: 8px; padding: 14px 10px;
  font: inherit; font-weight: 600; cursor: pointer;
  color: #111323; background: var(--accent);
}
#next { background: #252941; color: var(--text); }
button:disabled { opacity: .6; cursor: wait; }
.volume { margin-top: 18px; }
.volume-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
input { width: 100%; margin-top: 9px; accent-color: var(--accent); }
#status { text-align: center; color: var(--muted); font-size: 11px; margin-top: 15px; min-height: 14px; }
footer { text-align: center; color: #686e86; font-size: 10px; letter-spacing: 2px; margin-top: 18px; }
@media(max-width:430px) {
  body { padding: 14px; }
  .scene { height: 160px; }
  .buttons { flex-direction: column; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">INDEPENDENT RADIO</div>
    <h1>Midnight FM</h1>
    <div class="subtitle">somewhere between yesterday and tomorrow</div>
  </header>

  <div class="scene" aria-hidden="true">
    <div class="moon"></div>
    <div class="skyline">
      <div class="building" style="height:48%"></div>
      <div class="building" style="height:76%"></div>
      <div class="building" style="height:57%"></div>
      <div class="building" style="height:90%"></div>
      <div class="building" style="height:64%"></div>
      <div class="building" style="height:80%"></div>
      <div class="building" style="height:52%"></div>
      <div class="building" style="height:68%"></div>
      <div class="building" style="height:43%"></div>
    </div>
  </div>

  <div class="now">
    <div class="label">NOW PLAYING</div>
    <div id="trackName">Midnight memories</div>
    <div id="trackDesc">a little music for the hours that belong to you</div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button id="toggle">▶ Start radio</button>
      <button id="next">⏭ Следующий трек</button>
    </div>
    <div class="volume">
      <div class="volume-head"><label for="volume">Volume</label><span id="volumeValue">70%</span></div>
      <input id="volume" type="range" min="0" max="100" value="70">
    </div>
    <div id="status">Radio is sleeping.</div>
  </div>
  <footer>24 HOURS · AFTER DARK · ALWAYS ON</footer>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const TITLES = [
    ["Midnight memories", "somewhere you used to know"],
    ["Rain on the window", "the city never really sleeps"],
    ["Last train home", "one more stop before tomorrow"],
    ["Blue hour", "nothing urgent, nowhere to be"],
    ["Empty streets", "let the night take its time"],
    ["Almost morning", "just a little longer"],
    ["Distant lights", "the world feels softer from here"],
    ["After the rain", "everything is quiet again"],
    ["No destination", "it's about the road, not the end"],
    ["Sleepless", "thoughts drifting past the window"],
    ["Neon dreams", "somewhere far from the noise"],
    ["Slow motion", "there's no need to hurry"],
    ["Window seat", "watching the world go by"],
    ["Soft focus", "nothing needs an answer tonight"],
    ["City lights", "a thousand lives passing by"]
  ];

  let ctx, master, musicBus, ambientBus, ambientBuffer, ambientSource;
  let playing = false;
  let schedulerTimer = null;
  let nextTime = 0;
  let bar = 0;
  let bpm = 70;
  let keyRoot = 45;
  let scale = [0, 3, 5, 7, 10];
  let progression = [0, 3, 5, 4];
  let groove = {};
  let lastTitle = -1;
  let activeNodes = new Set();
  let barDuration = 60 / bpm * 4;
  let nextTrackRequested = false;
  let fadeGeneration = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const chance = p => Math.random() < p;
  const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);

  function setStatus(s) { $("status").textContent = s; }

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("Web Audio is not supported");

    ctx = new AC();
    master = ctx.createGain();
    musicBus = ctx.createGain();
    ambientBus = ctx.createGain();

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -22;
    comp.knee.value = 20;
    comp.ratio.value = 3;
    comp.attack.value = 0.015;
    comp.release.value = 0.3;

    musicBus.connect(master);
    ambientBus.connect(master);
    master.connect(comp);
    comp.connect(ctx.destination);
    setVolume();
  }

  function setVolume() {
    const v = Number($("volume").value) / 100;
    $("volumeValue").textContent = Math.round(v * 100) + "%";
    if (ctx && master) master.gain.setTargetAtTime(v, ctx.currentTime, 0.08);
  }

  async function loadAmbience() {
    if (ambientBuffer) return;
    const res = await fetch("Presets/ambience.mp3");
    if (!res.ok) throw new Error("Can't load Presets/ambience.mp3");
    ambientBuffer = await ctx.decodeAudioData(await res.arrayBuffer());
  }

  function trackNode(node) {
    activeNodes.add(node);
    node.addEventListener("ended", () => activeNodes.delete(node), { once: true });
  }

  function chooseTitle() {
    let i = Math.floor(Math.random() * TITLES.length);
    if (i === lastTitle) i = (i + 1) % TITLES.length;
    lastTitle = i;
    $("trackName").textContent = TITLES[i][0];
    $("trackDesc").textContent = TITLES[i][1];
  }

  function newTrack() {
    fadeGeneration++;
    bpm = pick([66, 68, 70, 72, 74, 76, 78]);
    keyRoot = pick([43, 45, 48, 50, 52, 55]);
    scale = pick([
      [0, 3, 5, 7, 10],
      [0, 2, 3, 7, 9],
      [0, 3, 5, 8, 10]
    ]);
    progression = pick([
      [0, 3, 5, 4], [0, 5, 3, 4], [0, 3, 1, 4],
      [0, 4, 5, 3], [5, 3, 0, 4], [0, 2, 5, 4],
      [0, 4, 1, 3], [3, 5, 0, 4], [0, 3, 4, 5]
    ]);

    groove = {
      drumStyle: pick(["soft", "dusty", "sparse", "steady", "broken"]),
      bassStyle: pick(["root", "walking", "sparse"]),
      pianoStyle: pick(["melodic", "arpeggio", "spacious", "fragments"]),
      density: rand(0.48, 0.78),
      swing: rand(0.01, 0.12),
      tone: rand(0.7, 1.0)
    };

    bar = 0;
    barDuration = 60 / bpm * 4;
    chooseTitle();
    setStatus("On air · " + bpm + " BPM");
  }

  function pluck(midi, when, duration, velocity, pan = 0) {
    const f = midiHz(midi);
    const osc = ctx.createOscillator();
    const overtone = ctx.createOscillator();
    const lowpass = ctx.createBiquadFilter();
    const envelope = ctx.createGain();
    const panNode = ctx.createStereoPanner();
    const overtoneGain = ctx.createGain();

    // Rounded, muted tone rather than a bright arcade-like beep.
    osc.type = "triangle";
    osc.frequency.setValueAtTime(f, when);
    overtone.type = "sine";
    overtone.frequency.setValueAtTime(f * 2.002, when);
    overtoneGain.gain.value = 0.10;

    lowpass.type = "lowpass";
    lowpass.frequency.setValueAtTime(rand(800, 1450), when);
    lowpass.frequency.exponentialRampToValueAtTime(450, when + duration);

    envelope.gain.setValueAtTime(0.0001, when);
    envelope.gain.linearRampToValueAtTime(velocity, when + 0.025);
    envelope.gain.exponentialRampToValueAtTime(0.0001, when + duration);

    panNode.pan.setValueAtTime(pan, when);
    osc.connect(lowpass);
    overtone.connect(overtoneGain);
    overtoneGain.connect(lowpass);
    lowpass.connect(envelope);
    envelope.connect(panNode);
    panNode.connect(musicBus);

    osc.start(when);
    overtone.start(when);
    osc.stop(when + duration + 0.05);
    overtone.stop(when + duration + 0.05);
    trackNode(osc);
    trackNode(overtone);

    osc.onended = () => {
      osc.disconnect(); overtone.disconnect(); overtoneGain.disconnect();
      lowpass.disconnect(); envelope.disconnect(); panNode.disconnect();
    };
  }

  function bassNote(midi, when, duration, velocity) {
    const osc = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(midiHz(midi), when);
    filter.type = "lowpass";
    filter.frequency.value = 150;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(velocity, when + 0.035);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);

    osc.connect(filter); filter.connect(gain); gain.connect(musicBus);
    osc.start(when); osc.stop(when + duration + 0.05);
    trackNode(osc);
    osc.onended = () => { osc.disconnect(); filter.disconnect(); gain.disconnect(); };
  }

  function kick(when, vol = 0.09) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(88, when);
    osc.frequency.exponentialRampToValueAtTime(39, when + 0.14);
    gain.gain.setValueAtTime(vol, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.17);
    osc.connect(gain); gain.connect(musicBus);
    osc.start(when); osc.stop(when + 0.18);
    trackNode(osc);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  }

  function noiseHit(when, type, volume) {
    const dur = type === "hat" ? 0.035 : 0.09;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    }
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    src.buffer = buf;
    filter.type = type === "hat" ? "highpass" : "bandpass";
    filter.frequency.value = type === "hat" ? 6800 : 1600;
    gain.gain.setValueAtTime(volume, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    src.connect(filter); filter.connect(gain); gain.connect(musicBus);
    src.start(when);
    trackNode(src);
    src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
  }

  function makeMelody(chordRoot) {
    const notes = [];
    let cursor = pick([0, 0.5, 1]);
    let prev = chordRoot + 12 + pick([0, 3, 7, 10]);
    const targetCount = pick([3, 4, 5, 6, 7]);

    for (let i = 0; i < targetCount && cursor < 4; i++) {
      let candidate = prev + pick([-7, -5, -3, -2, 0, 2, 3, 5, 7]);
      candidate = Math.max(keyRoot + 12, Math.min(keyRoot + 28, candidate));

      const allowed = scale.map(s => ((keyRoot + s) % 12));
      if (!allowed.includes(candidate % 12)) {
        candidate = pick([
          chordRoot + 12,
          chordRoot + 12 + scale[2],
          chordRoot + 12 + scale[3]
        ]);
      }

      if (chance(0.18)) candidate += 12;
      notes.push({
        beat: cursor,
        midi: candidate,
        duration: rand(0.45, 1.45),
        velocity: rand(0.035, 0.07) * groove.tone,
        pan: rand(-0.45, 0.45)
      });
      prev = candidate;
      cursor += pick([0.5, 0.5, 1, 1, 1.5, 2]);
    }
    return notes;
  }

  function scheduleBar(when) {
    const beatLen = 60 / bpm;
    const chordDegree = progression[bar % progression.length];
    const chordRoot = keyRoot + scale[chordDegree % scale.length];
    const chordNotes = [
      chordRoot + 12,
      chordRoot + 12 + scale[2],
      chordRoot + 12 + scale[4],
      chordRoot + 24
    ];

    const melody = makeMelody(chordRoot);

    // Occasional gentle chord bed, not a constant wall of sound.
    if (groove.pianoStyle === "spacious" && chance(0.5)) {
      chordNotes.slice(0, 3).forEach((n, i) => {
        pluck(n, when + i * 0.045, rand(1.3, 2.1), 0.014, (i - 1) * 0.35);
      });
    }

    for (const n of melody) {
      if (!chance(groove.density)) continue;
      const noteTime = when + n.beat * beatLen;
      pluck(n.midi, noteTime, n.duration, n.velocity, n.pan);

      if (groove.pianoStyle === "arpeggio" && chance(0.38)) {
        pluck(n.midi + 12, noteTime + beatLen * 0.5,
          n.duration * 0.65, n.velocity * 0.48, -n.pan);
      }
      if (groove.pianoStyle === "fragments" && chance(0.18)) {
        pluck(n.midi - 12, noteTime + beatLen * 0.75,
          n.duration * 0.55, n.velocity * 0.5, -n.pan);
      }
    }

    // Bass rhythm changes between tracks.
    if (groove.bassStyle !== "sparse" || chance(0.55)) {
      bassNote(chordRoot - 12, when, beatLen * 1.5, 0.09);
      if (groove.bassStyle === "walking" && chance(0.75)) {
        const passing = chordRoot - 12 + pick([2, 3, 5, 7]);
        bassNote(passing, when + beatLen * 2.5, beatLen * 0.65, 0.05);
      } else if (groove.bassStyle === "root" && chance(0.55)) {
        bassNote(chordRoot - 12, when + beatLen * 2, beatLen, 0.055);
      }
    }

    // Softer, less frequent drums.
    const drum = groove.drumStyle;
    if (drum !== "sparse" && chance(drum === "steady" ? 0.9 : 0.7)) {
      kick(when, drum === "soft" ? 0.055 : 0.075);
    }
    if (drum !== "sparse" && chance(0.48)) {
      kick(when + beatLen * 2, 0.055);
    }
    if (drum === "steady" || (drum !== "sparse" && chance(0.45))) {
      noiseHit(when + beatLen, "snare", 0.013);
      noiseHit(when + beatLen * 3, "snare", 0.015);
    } else if (chance(0.22)) {
      noiseHit(when + beatLen * pick([1, 2, 3]), "snare", 0.012);
    }
    for (let i = 0; i < 8; i++) {
      if (chance(drum === "dusty" ? 0.32 : 0.42)) {
        noiseHit(when + i * beatLen * 0.5, "hat", rand(0.003, 0.007));
      }
    }

    bar++;
    return beatLen * 4;
  }

  function scheduler() {
    if (!playing) return;
    const horizon = ctx.currentTime + 0.22;

    while (nextTime < horizon) {
      if (nextTrackRequested) {
        nextTrackRequested = false;
        newTrack();
      }

      // Change musical language every few bars, not just the displayed title.
      if (bar > 0 && bar % 8 === 0) {
        groove.density = rand(0.42, 0.8);
        groove.pianoStyle = pick(["melodic", "arpeggio", "spacious", "fragments"]);
        groove.bassStyle = pick(["root", "walking", "sparse"]);
        groove.drumStyle = pick(["soft", "dusty", "sparse", "steady", "broken"]);
      }

      nextTime += scheduleBar(nextTime);
    }
  }

  async function start() {
    if (playing) return;
    $("toggle").disabled = true;
    setStatus("Tuning in...");

    try {
      init();
      await ctx.resume();
      await loadAmbience();

      if (!ambientSource) {
        ambientSource = ctx.createBufferSource();
        ambientSource.buffer = ambientBuffer;
        ambientSource.loop = true;
        ambientSource.connect(ambientBus);
        ambientSource.start();
      }

      const now = ctx.currentTime;
      ambientBus.gain.cancelScheduledValues(now);
      ambientBus.gain.setTargetAtTime(0.035, now, 0.5);
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setTargetAtTime(1.0, now, 0.6);

      playing = true;
      newTrack();
      nextTime = ctx.currentTime + 0.15;
      schedulerTimer = setInterval(scheduler, 25);
      $("toggle").textContent = "Ⅱ Pause radio";
      setStatus("On air · new melodies, endlessly");
    } catch (e) {
      console.error(e);
      setStatus("Couldn't load Presets/ambience.mp3. Check the folder.");
      playing = false;
    } finally {
      $("toggle").disabled = false;
    }
  }

  function stop() {
    playing = false;
    clearInterval(schedulerTimer);
    schedulerTimer = null;

    if (ctx) {
      const now = ctx.currentTime;
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setTargetAtTime(0, now, 0.08);
      ambientBus.gain.cancelScheduledValues(now);
      ambientBus.gain.setTargetAtTime(0, now, 0.08);
    }

    setTimeout(() => {
      if (playing) return;
      try {
        if (ambientSource) {
          ambientSource.stop();
          ambientSource.disconnect();
          ambientSource = null;
        }
        for (const node of activeNodes) {
          try { node.stop(); } catch (_) {}
        }
        activeNodes.clear();
      } catch (_) {}
    }, 400);

    $("toggle").textContent = "▶ Start radio";
    setStatus("Radio is sleeping.");
  }

  $("toggle").addEventListener("click", () => {
    if (playing) stop();
    else start();
  });

  $("next").addEventListener("click", () => {
    if (!playing) {
      start().then(() => {
        nextTrackRequested = true;
      });
      return;
    }
    nextTrackRequested = true;
    setStatus("Finding another little world...");
  });

  $("volume").addEventListener("input", setVolume);
  setStatus("Radio is sleeping.");
})();
</script>
</body>
</html>
