
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight FM — Procedural Lo-fi</title>
<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 20px;
  display: grid; place-items: center;
  background: #0b101c; color: #ece8df;
  font-family: Georgia, serif;
}
main {
  width: min(440px, 100%); padding: 30px;
  border: 1px solid #414354; border-radius: 20px;
  background: linear-gradient(160deg, #202536, #121725 75%);
  box-shadow: 0 24px 80px #0007;
}
.eyebrow {
  color: #b8a88e; font: 10px Arial, sans-serif;
  letter-spacing: 4px; text-transform: uppercase;
}
h1 { font-size: 29px; font-weight: normal; letter-spacing: 2px; margin: 12px 0 8px; }
p { color: #b4b6c3; font-size: 14px; line-height: 1.6; }
button {
  width: 100%; margin-top: 11px; padding: 14px;
  border: 1px solid #5a6072; border-radius: 28px;
  background: #30384b; color: #f2eee6; font-size: 14px;
  cursor: pointer;
}
button:hover { background: #414b60; }
button:disabled { opacity: .45; cursor: wait; }
.primary { background: #d5c8ad; color: #191d28; border-color: transparent; }
#status { min-height: 38px; margin-top: 18px; color: #c0b49e; font: 12px/1.6 Arial, sans-serif; }
.small { color: #818ba0; font: 11px/1.6 Arial, sans-serif; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Midnight FM · sound lab</div>
  <h1>Endless Lo-fi</h1>
  <p>
    Тёплое пианино, меняющиеся аккорды и мелодии,
    которые сочиняются прямо во время воспроизведения.
  </p>

  <button id="load" class="primary">1. Загрузить пианино</button>
  <button id="chord" disabled>Тест: тёплый аккорд</button>
  <button id="melody" disabled>Тест: мелодия</button>
  <button id="play" class="primary" disabled>▶ Запустить генератор</button>
  <button id="stop" disabled>■ Остановить музыку</button>

  <div id="status">Сначала загрузи звуки.</div>
  <div class="small">
    Темп: 72 BPM · тональность: до минор ·
    случайные мелодические фразы и гармонические последовательности.
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const loadButton = $("load");
  const chordButton = $("chord");
  const melodyButton = $("melody");
  const playButton = $("play");
  const stopButton = $("stop");
  const status = $("status");

  let piano = null;
  let ready = false;
  let loading = false;
  let playing = false;
  let noise = null;
  let noiseGain = null;
  let effects = [];
  let repeatId = null;
  let barNumber = 0;

  const BPM = 72;
  const beat = 60 / BPM;

  // Гармонии в до миноре. Порядок аккордов меняется
  // между музыкальными фразами, но звучание остаётся согласованным.
  const progressions = [
    [
      { name: "Cm", notes: ["C3", "D#3", "G3"], bass: "C3" },
      { name: "Ab", notes: ["C3", "G#3", "D#4"], bass: "G#3" },
      { name: "Eb", notes: ["D#3", "G3", "A#3"], bass: "D#3" },
      { name: "Bb", notes: ["A#3", "D4", "F4"], bass: "A#3" }
    ],
    [
      { name: "Cm", notes: ["C3", "D#3", "G3"], bass: "C3" },
      { name: "Bb", notes: ["A#3", "D4", "F4"], bass: "A#3" },
      { name: "Ab", notes: ["C3", "G#3", "D#4"], bass: "G#3" },
      { name: "G", notes: ["B3", "D4", "G4"], bass: "G3" }
    ],
    [
      { name: "Ab", notes: ["C3", "G#3", "D#4"], bass: "G#3" },
      { name: "Eb", notes: ["D#3", "G3", "A#3"], bass: "D#3" },
      { name: "Cm", notes: ["C3", "D#3", "G3"], bass: "C3" },
      { name: "Bb", notes: ["A#3", "D4", "F4"], bass: "A#3" }
    ]
  ];

  // Пентатоника до минора: безопасный набор нот
  // для создания мелодий поверх этих аккордов.
  const scale = [
    "C4", "D#4", "F4", "G4", "A#4",
    "C5", "D#5", "F5", "G5"
  ];

  function say(message) {
    status.textContent = message;
  }

  function setControls() {
    chordButton.disabled = !ready || playing;
    melodyButton.disabled = !ready || playing;
    playButton.disabled = !ready || playing;
    stopButton.disabled = !playing;
  }

  function makeNoise() {
    noise = new Tone.Noise("pink");
    const highpass = new Tone.Filter({
      type: "highpass", frequency: 1800, rolloff: -12
    });
    const lowpass = new Tone.Filter({
      type: "lowpass", frequency: 6500
    });
    noiseGain = new Tone.Gain(0.008);

    noise.connect(highpass);
    highpass.connect(lowpass);
    lowpass.connect(noiseGain);
    noiseGain.toDestination();
    noise.start();

    effects.push(noise, highpass, lowpass, noiseGain);
  }

  async function loadPiano() {
    if (loading || ready) return;

    if (typeof Tone === "undefined") {
      say("Tone.js не загрузился. Обнови страницу.");
      return;
    }

    loading = true;
    loadButton.disabled = true;
    say("Загружаем звуки и эффекты…");

    try {
      await Tone.start();

      const highpass = new Tone.Filter({
        type: "highpass", frequency: 85, rolloff: -12
      });
      const lowpass = new Tone.Filter({
        type: "lowpass", frequency: 6200, rolloff: -12
      });
      const compressor = new Tone.Compressor({
        threshold: -25, ratio: 2, attack: 0.025, release: 0.25
      });
      const saturation = new Tone.Distortion(0.07);
      saturation.wet.value = 0.16;
      const reverb = new Tone.Reverb({ decay: 3.2, wet: 0.2 });

      highpass.connect(lowpass);
      lowpass.connect(compressor);
      compressor.connect(saturation);
      saturation.connect(reverb);
      reverb.toDestination();

      effects.push(highpass, lowpass, compressor, saturation, reverb);
      await reverb.generate();

      piano = new Tone.Sampler({
        urls: {
          C3: "C3.mp3",
          "D#3": "Ds3.mp3",
          "F#3": "Fs3.mp3",
          A3: "A3.mp3",
          C4: "C4.mp3",
          "D#4": "Ds4.mp3",
          "F#4": "Fs4.mp3",
          A4: "A4.mp3",
          C5: "C5.mp3",
          "D#5": "Ds5.mp3",
          "F#5": "Fs5.mp3",
          A5: "A5.mp3",
          C6: "C6.mp3"
        },
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        attack: 0.025,
        release: 2.2
      });

      piano.connect(highpass);
      piano.volume.value = -4;

      await Tone.loaded();
      makeNoise();

      ready = true;
      setControls();
      say("Готово! Можно тестировать звук или запускать генератор.");
    } catch (error) {
      console.error(error);
      say("Ошибка загрузки: " + error.message);
      loadButton.disabled = false;
      disposeAudio();
    } finally {
      loading = false;
    }
  }

  function disposeAudio() {
    if (piano) {
      try { piano.dispose(); } catch (_) {}
      piano = null;
    }
    for (const effect of effects) {
      try { effect.dispose(); } catch (_) {}
    }
    effects = [];
    ready = false;
  }

  function playChordTest() {
    if (!ready || playing) return;
    const now = Tone.now() + 0.1;

    piano.triggerAttackRelease(
      ["C4", "D#4", "G4", "A#4", "D#5"],
      4, now, 0.48
    );
    piano.triggerAttackRelease(
      ["G3", "C4"], 3.5, now + 0.08, 0.24
    );
    say("Звучит тёплый аккорд.");
  }

  function playMelodyTest() {
    if (!ready || playing) return;
    const now = Tone.now() + 0.1;
    const notes = [
      ["G4", 0, 0.38, 1.1],
      ["D#5", 0.7, 0.32, 0.9],
      ["C5", 1.4, 0.38, 1.3],
      ["G4", 2.3, 0.29, 0.9],
      ["A#4", 2.8, 0.37, 1.2],
      ["G4", 3.6, 0.30, 1.0],
      ["D#4", 4.3, 0.34, 1.4],
      ["C4", 5.1, 0.42, 1.8],
      ["G4", 6.1, 0.27, 1.0],
      ["C5", 6.7, 0.33, 1.5]
    ];

    piano.triggerAttackRelease(
      ["C4", "D#4", "G4"], 3.4, now, 0.22
    );
    piano.triggerAttackRelease(
      ["A#3", "D4", "F4"], 3.1, now + 3.6, 0.18
    );

    for (const [note, offset, velocity, duration] of notes) {
      piano.triggerAttackRelease(
        note, duration, now + offset, velocity
      );
    }
    say("Звучит тестовая мелодия.");
  }

  function choose(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function makePhrase() {
    // Меняем гармонию не на каждом такте, а после фразы.
    if (barNumber % 4 === 0) {
      makePhrase.progression = choose(progressions);
    }
    return makePhrase.progression[barNumber % 4];
  }

  function generateBar(time) {
    const chord = makePhrase();
    const isNewPhrase = barNumber % 4 === 0;

    // Аккорд на сильную долю, иногда чуть тише.
    piano.triggerAttackRelease(
      chord.notes,
      3.6 * beat,
      time,
      isNewPhrase ? 0.34 : 0.27 + Math.random() * 0.08
    );

    // Редкая низкая опора, чтобы музыка дышала.
    if (Math.random() > 0.25) {
      piano.triggerAttackRelease(
        chord.bass,
        1.8 * beat,
        time + 0.02,
        0.15 + Math.random() * 0.08
      );
    }

    // 2–4 мелодические ноты с паузами.
    const count = 2 + Math.floor(Math.random() * 3);
    const slots = [0.5, 1, 1.5, 2, 2.5, 3, 3.5];
    const used = [];

    for (let i = 0; i < count; i++) {
      let slot = choose(slots);
      let attempts = 0;

      while (used.includes(slot) && attempts < 10) {
        slot = choose(slots);
        attempts++;
      }
      used.push(slot);

      // Иногда оставляем такт почти без мелодии.
      if (Math.random() < 0.14) continue;

      let note = choose(scale);

      // Иногда делаем соседний шаг, чтобы мелодия
      // звучала более связно, а не как чистая случайность.
      if (i > 0 && Math.random() < 0.48) {
        const previous = scale.indexOf(generateBar.previousNote);
        if (previous >= 0) {
          const step = choose([-2, -1, 1, 2]);
          note = scale[Math.max(0, Math.min(scale.length - 1, previous + step))];
        }
      }

      generateBar.previousNote = note;

      const velocity = 0.13 + Math.random() * 0.16;
      const duration = choose([0.45, 0.7, 1.0, 1.3]);

      piano.triggerAttackRelease(
        note,
        duration,
        time + slot * beat,
        velocity
      );
    }

    barNumber++;
  }

  async function startGenerator() {
    if (!ready || playing) return;

    try {
      await Tone.start();

      playing = true;
      barNumber = 0;
      generateBar.previousNote = "G4";

      Tone.Transport.stop();
      Tone.Transport.cancel();
      Tone.Transport.bpm.value = BPM;
      Tone.Transport.timeSignature = 4;

      // Первый такт и дальнейшая генерация идут по часам Tone.js.
      repeatId = Tone.Transport.scheduleRepeat((time) => {
        generateBar(time);
      }, "1m");

      Tone.Transport.start("+0.1");

      setControls();
      say("Midnight FM играет. Музыка сочиняется на ходу…");
    } catch (error) {
      console.error(error);
      say("Не удалось запустить музыку: " + error.message);
      playing = false;
      setControls();
    }
  }

  function stopGenerator() {
    if (!playing) return;

    Tone.Transport.stop();
    Tone.Transport.cancel();
    repeatId = null;
    playing = false;
    setControls();
    say("Музыка остановлена. Можешь запустить новую генерацию.");
  }

  loadButton.addEventListener("click", loadPiano);
  chordButton.addEventListener("click", playChordTest);
  melodyButton.addEventListener("click", playMelodyTest);
  playButton.addEventListener("click", startGenerator);
  stopButton.addEventListener("click", stopGenerator);
})();
</script>
</body>
</html>
