
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight FM</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090b14;
  --panel: #111522;
  --text: #e8e8f1;
  --muted: #858ba5;
  --accent: #a9a2ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 0%, #20223d 0%, var(--bg) 65%);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app { width: min(100%, 620px); }
header { text-align: center; margin-bottom: 26px; }
.logo {
  font-size: 12px; letter-spacing: 5px;
  color: var(--accent); text-transform: uppercase;
}
h1 {
  font-size: clamp(32px, 7vw, 48px);
  font-weight: 300; letter-spacing: 2px;
  margin: 12px 0 7px;
}
.subtitle { color: var(--muted); font-size: 13px; }
.scene {
  height: 190px; position: relative; overflow: hidden;
  border-radius: 14px; margin-bottom: 18px;
  background: linear-gradient(180deg, #171a32 0%, #30314b 65%, #151827 100%);
}
.moon {
  position: absolute; width: 54px; height: 54px;
  top: 26px; right: 19%; border-radius: 50%;
  background: #e4e0ff;
  box-shadow: 0 0 35px #b1a8ff55;
}
.skyline {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 105px; display: flex; align-items: end;
  justify-content: space-around; gap: 4px;
}
.building {
  flex: 1; max-width: 58px; background: #101321;
  position: relative; border-radius: 2px 2px 0 0;
}
.building:after {
  content: ""; position: absolute; inset: 10px 7px;
  background: repeating-linear-gradient(
    0deg, transparent 0 10px, #a7a3e525 10px 13px
  );
}
.now {
  padding: 20px 18px; border-radius: 12px;
  background: var(--panel); border: 1px solid #ffffff0d;
  text-align: center; margin-bottom: 14px;
}
.track-label {
  font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--muted);
}
#trackName { font-size: 19px; margin-top: 9px; }
#trackDesc { font-size: 12px; color: var(--muted); margin-top: 5px; }
.controls {
  padding: 20px; border-radius: 12px;
  background: var(--panel); border: 1px solid #ffffff0d;
}
.buttons { display: flex; gap: 10px; margin-bottom: 22px; }
button {
  border: 0; border-radius: 8px; padding: 13px 16px;
  cursor: pointer; font: inherit; transition: opacity .2s, background .2s;
}
button:disabled { opacity: .5; cursor: wait; }
#toggle {
  flex: 1; background: var(--accent); color: #111323;
  font-weight: 650;
}
#variation {
  background: #252941; color: var(--text);
}
.sliders { display: grid; gap: 17px; }
.slider-head {
  display: flex; justify-content: space-between;
  font-size: 13px; margin-bottom: 7px;
}
.slider-head span:last-child { color: var(--muted); }
input[type=range] {
  width: 100%; accent-color: var(--accent); cursor: pointer;
}
.status {
  margin-top: 16px; font-size: 11px;
  color: var(--muted); text-align: center; min-height: 16px;
}
footer {
  color: #686e86; text-align: center;
  font-size: 11px; margin-top: 18px; letter-spacing: 1px;
}
@media(max-width: 430px) {
  body { padding: 14px; }
  .controls { padding: 16px; }
  .scene { height: 160px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Independent radio</div>
    <h1>Midnight FM</h1>
    <div class="subtitle">somewhere between yesterday and tomorrow</div>
  </header>

  <div class="scene" aria-hidden="true">
    <div class="moon"></div>
    <div class="skyline">
      <div class="building" style="height:48%"></div>
      <div class="building" style="height:76%"></div>
      <div class="building" style="height:57%"></div>
      <div class="building" style="height:90%"></div>
      <div class="building" style="height:64%"></div>
      <div class="building" style="height:80%"></div>
      <div class="building" style="height:52%"></div>
      <div class="building" style="height:68%"></div>
      <div class="building" style="height:43%"></div>
    </div>
  </div>

  <div class="now">
    <div class="track-label">Now playing</div>
    <div id="trackName">Midnight memories</div>
    <div id="trackDesc">waiting for the night...</div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button id="toggle">▶ Start radio</button>
      <button id="variation">↻ New variation</button>
    </div>
    <div class="sliders">
      <div>
        <div class="slider-head"><label for="music">Piano</label><span id="musicVal">70%</span></div>
        <input id="music" type="range" min="0" max="100" value="70">
      </div>
      <div>
        <div class="slider-head"><label for="beat">Beat</label><span id="beatVal">35%</span></div>
        <input id="beat" type="range" min="0" max="100" value="35">
      </div>
      <div>
        <div class="slider-head"><label for="bass">Bass</label><span id="bassVal">40%</span></div>
        <input id="bass" type="range" min="0" max="100" value="40">
      </div>
      <div>
        <div class="slider-head"><label for="amb">Ambience</label><span id="ambVal">45%</span></div>
        <input id="amb" type="range" min="0" max="100" value="45">
      </div>
      <div>
        <div class="slider-head"><label for="master">Master volume</label><span id="masterVal">75%</span></div>
        <input id="master" type="range" min="0" max="100" value="75">
      </div>
    </div>
    <div class="status" id="status">Radio is sleeping.</div>
  </div>
  <footer>24 HOURS · AFTER DARK · ALWAYS ON</footer>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const files = {
    piano: "Presets/piano.wav",
    beat: "Presets/drums.wav",
    bass: "Presets/bass.wav",
    amb: "Presets/ambience.mp3"
  };

  let ctx, master, compressor;
  let playing = false;
  let buffers = {};
  let layers = {};
  let timer = null;
  let variationTimer = null;
  let stepTimer = null;
  let pianoTimer = null;
  let nextStepTime = 0;
  let step = 0;
  let generation = 0;
  let currentPattern = null;
  let activeNodes = new Set();

  const scale = [0, 2, 3, 7, 10];
  const rootMidi = 45;
  const titles = [
    ["Midnight memories", "somewhere you used to know"],
    ["Rain on the window", "the city never really sleeps"],
    ["Last train home", "one more stop before tomorrow"],
    ["Blue hour", "nothing urgent, nowhere to be"],
    ["Empty streets", "let the night take its time"],
    ["Almost morning", "just a little longer"],
    ["Distant lights", "the world feels softer from here"],
    ["After the rain", "everything is quiet again"],
    ["No destination", "it's about the road, not the end"],
    ["Sleepless", "thoughts drifting past the window"]
  ];

  function setStatus(message) {
    $("status").textContent = message;
  }

  function random(min, max) {
    return min + Math.random() * (max - min);
  }

  function pick(array) {
    return array[Math.floor(Math.random() * array.length)];
  }

  function initAudio() {
    if (ctx) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error("Web Audio is not supported.");

    ctx = new AudioContextClass();
    master = ctx.createGain();
    compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 16;
    compressor.ratio.value = 3;
    compressor.attack.value = 0.02;
    compressor.release.value = 0.3;
    master.connect(compressor);
    compressor.connect(ctx.destination);
    applyVolumes();
  }

  async function loadBuffers() {
    initAudio();
    const results = await Promise.all(
      Object.entries(files).map(async ([name, path]) => {
        const response = await fetch(path);
        if (!response.ok) throw new Error("Can't load " + path);
        const data = await response.arrayBuffer();
        buffers[name] = await ctx.decodeAudioData(data);
      })
    );
    return results;
  }

  function applyVolumes() {
    if (!ctx) return;
    const values = {
      piano: Number($("music").value) / 100,
      beat: Number($("beat").value) / 100,
      bass: Number($("bass").value) / 100,
      amb: Number($("amb").value) / 100
    };
    for (const [key, value] of Object.entries(values)) {
      $(key === "piano" ? "musicVal" : key + "Val").textContent =
        Math.round(value * 100) + "%";
      if (layers[key]) {
        layers[key].gain.gain.setTargetAtTime(value, ctx.currentTime, 0.12);
      }
    }
    $("masterVal").textContent = $("master").value + "%";
    master.gain.setTargetAtTime(Number($("master").value) / 100,
      ctx.currentTime, 0.12);
  }

  function createLayer(name, gainValue) {
    const gain = ctx.createGain();
    gain.gain.value = gainValue;
    gain.connect(master);
    layers[name] = { gain };
  }

  function sourceFromBuffer(name, offset = 0, duration = null) {
    const source = ctx.createBufferSource();
    source.buffer = buffers[name];
    source.loop = true;
    source.connect(layers[name].gain);
    const length = buffers[name].duration;
    source.start(0, Math.max(0, offset % length));
    activeNodes.add(source);
    source.onended = () => activeNodes.delete(source);
    return source;
  }

  function makePattern() {
    const progression = pick([
      [0, 3, 5, 4],
      [0, 5, 3, 4],
      [0, 3, 1, 4],
      [0, 4, 5, 3],
      [5, 3, 0, 4],
      [0, 2, 5, 4]
    ]);
    const notes = [];
    const length = pick([8, 12, 16]);
    let lastNote = 0;

    for (let i = 0; i < length; i++) {
      const bar = Math.floor(i / 4);
      const chord = progression[bar % progression.length];
      const hasNote = Math.random() < pick([0.52, 0.68, 0.78]);
      if (!hasNote) {
        notes.push(null);
        continue;
      }

      let degree = chord + pick([0, 0, 1, 2, 4]);
      if (Math.random() < 0.22) degree += 5;
      let octave = pick([0, 0, 1]);
      let midi = rootMidi + scale[degree % scale.length] + octave * 12;

      if (lastNote && Math.random() < 0.65) {
        midi = Math.max(lastNote - 12, Math.min(lastNote + 12, midi));
      }
      lastNote = midi;
      notes.push({
        midi,
        velocity: random(0.045, 0.11),
        duration: random(1.2, 2.7),
        pan: random(-0.55, 0.55)
      });
    }

    return {
      progression,
      notes,
      beatStyle: pick(["soft", "sparse", "steady", "half"]),
      bassStyle: pick(["root", "syncopated", "sparse"]),
      swing: random(0.0, 0.13),
      bpm: pick([66, 68, 70, 72, 74, 76])
    };
  }

  function midiFrequency(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function playPianoNote(note, when) {
    if (!playing || !note) return;
    const osc = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    const pan = ctx.createStereoPanner();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(midiFrequency(note.midi), when);
    filter.type = "lowpass";
    filter.frequency.value = 1800;
    filter.Q.value = 0.45;
    pan.pan.value = note.pan;

    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(note.velocity, when + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + note.duration);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(pan);
    pan.connect(master);
    osc.start(when);
    osc.stop(when + note.duration + 0.05);

    activeNodes.add(osc);
    osc.onended = () => {
      activeNodes.delete(osc);
      osc.disconnect();
      filter.disconnect();
      gain.disconnect();
      pan.disconnect();
    };
  }

  function playBassNote(midi, when, duration = 0.45, volume = 0.07) {
    const osc = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(midiFrequency(midi), when);
    filter.type = "lowpass";
    filter.frequency.value = 180;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(volume, when + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    osc.start(when);
    osc.stop(when + duration + 0.05);
    activeNodes.add(osc);
    osc.onended = () => {
      activeNodes.delete(osc);
      osc.disconnect();
      filter.disconnect();
      gain.disconnect();
    };
  }

  function playKick(when, volume = 0.14) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(105, when);
    osc.frequency.exponentialRampToValueAtTime(42, when + 0.13);
    gain.gain.setValueAtTime(volume, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
    osc.connect(gain);
    gain.connect(master);
    osc.start(when);
    osc.stop(when + 0.17);
    activeNodes.add(osc);
    osc.onended = () => {
      activeNodes.delete(osc);
      osc.disconnect();
      gain.disconnect();
    };
  }

  function playHat(when, volume = 0.018) {
    const length = Math.floor(ctx.sampleRate * 0.045);
    const noiseBuffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    source.buffer = noiseBuffer;
    filter.type = "highpass";
    filter.frequency.value = 6500;
    gain.gain.setValueAtTime(volume, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.045);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    source.start(when);
    activeNodes.add(source);
    source.onended = () => {
      activeNodes.delete(source);
      source.disconnect();
      filter.disconnect();
      gain.disconnect();
    };
  }

  function playSnare(when, volume = 0.035) {
    const length = Math.floor(ctx.sampleRate * 0.11);
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / length);
    }
    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    source.buffer = buffer;
    filter.type = "bandpass";
    filter.frequency.value = 1800;
    gain.gain.setValueAtTime(volume, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.11);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    source.start(when);
    activeNodes.add(source);
    source.onended = () => {
      activeNodes.delete(source);
      source.disconnect();
      filter.disconnect();
      gain.disconnect();
    };
  }

  function scheduleStep(when, stepNumber, pattern) {
    const beat = pattern.bpm / 60;
    const sixteenth = 60 / pattern.bpm / 4;
    const barStep = stepNumber % 16;
    const bar = Math.floor(stepNumber / 16);
    const chordIndex = Math.floor(barStep / 4);
    const chordDegree = pattern.progression[(bar + chordIndex) % pattern.progression.length];
    const noteIndex = Math.floor(barStep / 2) % pattern.notes.length;

    if (barStep % 2 === 0) {
      const note = pattern.notes[noteIndex];
      if (note && Math.random() < 0.84) {
        playPianoNote(note, when);
      }
    }

    const beatChance = pattern.beatStyle === "sparse" ? 0.55 :
      pattern.beatStyle === "half" ? 0.68 : 0.9;

    if (barStep % 4 === 0 && Math.random() < beatChance) {
      playKick(when, pattern.beatStyle === "soft" ? 0.095 : 0.13);
    }

    if ((barStep === 4 || barStep === 12) &&
        pattern.beatStyle !== "sparse" && Math.random() < 0.75) {
      playSnare(when, 0.028);
    }

    if (barStep % 2 === 1 && Math.random() < 0.7) {
      playHat(when, 0.012);
    } else if (barStep % 4 === 3 && Math.random() < 0.25) {
      playHat(when, 0.016);
    }

    if (barStep === 0 || (pattern.bassStyle === "syncopated" && barStep === 10) ||
        (pattern.bassStyle === "sparse" && barStep === 8)) {
      const bassMidi = rootMidi + scale[chordDegree % scale.length] - 12;
      playBassNote(bassMidi, when, 0.5, 0.075);
    }

    return sixteenth;
  }

  function scheduler() {
    if (!playing) return;
    const lookahead = 0.12;
    while (nextStepTime < ctx.currentTime + lookahead) {
      const pattern = currentPattern;
      const sixteenth = scheduleStep(nextStepTime, step, pattern);
      nextStepTime += sixteenth * (step % 2 === 1 ? 1 + pattern.swing : 1);
      step++;
    }
  }

  function stopTimers() {
    clearInterval(timer);
    clearInterval(variationTimer);
    clearInterval(stepTimer);
    clearInterval(pianoTimer);
    timer = variationTimer = stepTimer = pianoTimer = null;
  }

  function stopGeneratedAudio() {
    for (const node of activeNodes) {
      try { node.stop(); } catch (_) {}
    }
    activeNodes.clear();
  }

  function startBed() {
    for (const key of ["piano", "beat", "bass", "amb"]) {
      createLayer(key, 0);
      if (buffers[key]) {
        sourceFromBuffer(key, random(0, buffers[key].duration));
      }
    }

    // Keep the ambience layer; procedural instruments supply the musical variety.
    for (const key of ["piano", "beat", "bass"]) {
      layers[key].gain.gain.setValueAtTime(0, ctx.currentTime);
    }
    applyVolumes();
  }

  function updateTrackTitle() {
    const [name, description] = pick(titles);
    $("trackName").textContent = name;
    $("trackDesc").textContent = description;
  }

  function setNewVariation(initial = false) {
    if (!playing) return;
    generation++;
    currentPattern = makePattern();
    step = 0;
    nextStepTime = ctx.currentTime + 0.08;
    updateTrackTitle();

    // Change intensity gradually instead of abruptly cutting any sound.
    const now = ctx.currentTime;
    const fade = initial ? 0.8 : 2.5;
    layers.piano.gain.gain.cancelScheduledValues(now);
    layers.piano.gain.gain.setTargetAtTime(
      Number($("music").value) / 100, now, fade / 4
    );
    layers.beat.gain.gain.cancelScheduledValues(now);
    layers.beat.gain.gain.setTargetAtTime(
      Number($("beat").value) / 100, now, fade / 4
    );
    layers.bass.gain.gain.cancelScheduledValues(now);
    layers.bass.gain.gain.setTargetAtTime(
      Number($("bass").value) / 100, now, fade / 4
    );

    setStatus("Playing · " + currentPattern.bpm + " BPM · new arrangement");
  }

  async function startRadio() {
    if (playing) return;
    $("toggle").disabled = true;
    setStatus("Waking up the radio...");

    try {
      initAudio();
      if (!Object.keys(buffers).length) await loadBuffers();
      await ctx.resume();

      playing = true;
      startBed();
      setNewVariation(true);
      stepTimer = setInterval(scheduler, 25);
      variationTimer = setInterval(() => {
        if (playing) setNewVariation();
      }, random(45000, 85000));

      $("toggle").textContent = "Ⅱ Pause radio";
      setStatus("On air · let the night unfold");
    } catch (error) {
      console.error(error);
      setStatus("Couldn't load audio. Check the Presets folder and hosting.");
      playing = false;
    } finally {
      $("toggle").disabled = false;
    }
  }

  function stopRadio() {
    playing = false;
    stopTimers();
    stopGeneratedAudio();

    if (ctx) {
      const now = ctx.currentTime;
      for (const layer of Object.values(layers)) {
        layer.gain.gain.cancelScheduledValues(now);
        layer.gain.gain.setTargetAtTime(0, now, 0.12);
      }
    }

    $("toggle").textContent = "▶ Start radio";
    setStatus("Radio is sleeping.");
  }

  $("toggle").addEventListener("click", async () => {
    if (playing) stopRadio();
    else await startRadio();
  });

  $("variation").addEventListener("click", () => {
    if (playing) setNewVariation();
    else {
      updateTrackTitle();
      $("trackDesc").textContent = "press Start radio to listen";
    }
  });

  for (const id of ["music", "beat", "bass", "amb", "master"]) {
    $(id).addEventListener("input", applyVolumes);
  }

  updateTrackTitle();
  setStatus("Radio is sleeping.");
})();
</script>
</body>
</html>
