<!DOCTYPE html>
<html lang="ru" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>lofi.audius</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root,[data-theme="night"]{--bg:#121212;--surface:#1E1E1E;--border:#333;--text:#E0D8D0;--text-muted:#8A7A68;--text-dim:#5C5045;--accent:#C9A87C;--accent-2:#9B7FA6;--accent-glow:rgba(201,168,124,.2);--btn-primary-text:#121212}
[data-theme="day"]{--bg:#F5EFE6;--surface:#FFF;--border:#D8CFC2;--text:#3D3028;--text-muted:#7A6B5E;--text-dim:#A89888;--accent:#8B5E3C;--accent-2:#B87D9E;--accent-glow:rgba(139,94,60,.15);--btn-primary-text:#FFF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'SF Mono','Courier New',monospace;overflow:hidden;user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(160,130,180,.06),transparent 50%),var(--bg);z-index:-1}
.app{height:100dvh;display:flex;flex-direction:column;padding:12px 16px;max-width:520px;margin:0 auto;gap:10px}
.header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.brand-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;min-height:0}
.vinyl-wrap{position:relative;width:clamp(160px,46vw,210px);height:clamp(160px,46vw,210px);margin:0 auto}
.vinyl{width:100%;height:100%;border-radius:50%;position:relative;background:radial-gradient(circle,#0a0a0a 0%,#0a0a0a 12%,transparent 12%),radial-gradient(circle,var(--accent-2) 12%,var(--accent-2) 32%,transparent 32%),repeating-radial-gradient(circle,#0a0a0a 0px,#0a0a0a 1px,#1a1a1a 1px,#1a1a1a 2.5px,#151515 2.5px,#151515 3px);box-shadow:0 16px 40px rgba(0,0,0,.5);animation:spin 6s linear infinite;animation-play-state:paused}
.vinyl.spinning{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32%;height:32%;border-radius:50%;background:radial-gradient(circle,var(--accent-2),#8B5C75);display:flex;align-items:center;justify-content:center}
.vinyl-label::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:var(--bg)}
.label-text{font-size:10px;font-weight:700;color:#0a0a0a;text-align:center;line-height:1.1}
.glow{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow),transparent 60%);opacity:0;transition:opacity .5s;pointer-events:none;z-index:-1}
.glow.active{opacity:1;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.05);opacity:1}}
.now-playing{text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.np-title{font-size:clamp(18px,5vw,22px);font-weight:600;color:var(--text);line-height:1.15;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;justify-content:center;gap:18px}
.btn{border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);background:none}
.btn:active{transform:scale(.93)}
.btn svg{width:20px;height:20px}
.btn-play{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--btn-primary-text);box-shadow:0 5px 18px var(--accent-glow)}
.btn-play svg{width:26px;height:26px}
.btn-ctrl{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--border)}
.genres{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;justify-content:center}
.genres::-webkit-scrollbar{display:none}
.genre{flex-shrink:0;padding:7px 14px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:16px;cursor:pointer}
.genre.active{background:var(--accent);color:var(--btn-primary-text);border-color:var(--accent)}
.volume-row{display:flex;align-items:center;gap:10px}
.mute-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px}
.mute-btn.muted{opacity:.35}
.volume-slider{flex:1;height:3px;-webkit-appearance:none;appearance:none;background:var(--surface);border-radius:2px;outline:none;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent)}
.footer{display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);padding-top:8px;border-top:1px solid var(--border)}
.footer-time{color:var(--accent);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><span class="brand-dot"></span><span>lofi.audius</span></div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </header>
  <main class="main">
    <div class="vinyl-wrap">
      <div class="vinyl" id="vinyl"><div class="vinyl-label"><div class="label-text">LO<br>FI</div></div></div>
      <div class="glow" id="glow"></div>
    </div>
    <div class="now-playing">
      <div class="np-title" id="npTitle">Press play</div>
      <div class="np-meta" id="npMeta">audius stream</div>
    </div>
    <div class="controls">
      <button class="btn btn-ctrl" id="prevBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="btn btn-play" id="playBtn">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button class="btn btn-ctrl" id="nextBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="genres" id="genresWrap"></div>
    <div class="volume-row">
      <button class="mute-btn" id="muteBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg></button>
      <input type="range" min="0" max="100" value="65" class="volume-slider" id="volumeSlider">
    </div>
  </main>
  <footer class="footer"><span id="footerInfo">ready</span><span class="footer-time" id="elapsed">00:00</span></footer>
</div>

<script>
// ============================================================
// TELEGRAM
// ============================================================
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#121212'); tg.setBackgroundColor('#121212'); } catch(e){} }

const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ============================================================
// AUDIUS CONFIG
// ============================================================
const APP_NAME = 'lofi_player_demo_2026';
const HOSTS_FALLBACK = [
  'https://discoveryprovider.audius.co/v1',
  'https://discoveryprovider2.audius.co/v1',
  'https://discoveryprovider3.audius.co/v1',
];
let apiHost = HOSTS_FALLBACK[0];
let tracksPool = [];
let tracksByGenre = {};

// ============================================================
// STATE
// ============================================================
const state = {
  currentGenre: 'Lo-Fi',
  playing: false,
  currentTrack: null,
  lastTrackId: null,
  volume: 0.65,
  muted: false,
  elapsedStart: 0,
  elapsedAccum: 0,
};

const GENRES = [
  { key: 'Lo-Fi', label: 'Lo-Fi' },
  { key: 'Jazz', label: 'Jazz' },
  { key: 'Ambient', label: 'Ambient' },
  { key: 'Hip-Hop/Rap', label: 'Hip-Hop' },
];

// ============================================================
// AUDIUS API
// ============================================================
async function selectHost() {
  try {
    const res = await fetch('https://api.audius.co');
    const json = await res.json();
    if (json.data && json.data.length) {
      apiHost = json.data[Math.floor(Math.random() * json.data.length)] + '/v1';
    }
  } catch (e) {
    console.warn('Host discovery failed, using fallback', e);
  }
}

async function fetchTracks(genre, limit = 40) {
  if (tracksByGenre[genre]) return tracksByGenre[genre];

  const url = `${apiHost}/tracks/trending?app_name=${encodeURIComponent(APP_NAME)}&genre=${encodeURIComponent(genre)}&limit=${limit}`;
  let res = await fetch(url);
  if (!res.ok) {
    // fallback: search by keyword
    const q = genre === 'Lo-Fi' ? 'lofi' : genre.toLowerCase();
    const url2 = `${apiHost}/tracks/search?app_name=${encodeURIComponent(APP_NAME)}&query=${encodeURIComponent(q)}&limit=${limit}`;
    res = await fetch(url2);
  }
  if (!res.ok) throw new Error('Audius request failed: ' + res.status);

  const json = await res.json();
  const raw = json.data || [];

  const tracks = raw
    .filter(t => t.is_streamable && t.id)
    .map(t => ({
      id: t.id,
      title: t.title || 'Untitled',
      artist: t.user?.name || t.user?.handle || 'Unknown',
      genre: t.genre || genre,
      duration: t.duration || 0,
      streamUrl: `${apiHost}/tracks/${t.id}/stream?app_name=${encodeURIComponent(APP_NAME)}`,
    }));

  tracksByGenre[genre] = tracks;
  return tracks;
}

async function loadGenre(genre) {
  $('footerInfo').textContent = 'loading ' + genre + '…';
  try {
    const tracks = await fetchTracks(genre);
    if (!tracks.length) throw new Error('empty');
    tracksPool = tracks;
    $('footerInfo').textContent = `${tracks.length} треков · ${genre}`;
  } catch (e) {
    console.error(e);
    $('footerInfo').textContent = 'ошибка загрузки';
    tracksPool = [];
  }
}

// ============================================================
// AUDIO (dual-player crossfade)
// ============================================================
const players = [new Audio(), new Audio()];
players.forEach(p => { p.preload = 'auto'; p.volume = 0; });
let activeIdx = 0;

players.forEach((el, i) => {
  el.addEventListener('ended', () => {
    if (i === activeIdx && state.playing) playNext();
  });
});

// ============================================================
// PLAYBACK
// ============================================================
function pickNextTrack() {
  if (!tracksPool.length) return null;
  const candidates = tracksPool.filter(t => t.id !== state.lastTrackId);
  return pick(candidates.length ? candidates : tracksPool);
}

function updateTrackUI(track) {
  $('npTitle').textContent = track.title;
  $('npMeta').textContent = `${track.artist} · ${track.genre}`;
}

async function crossfadeTo(track, fadeMs = 2000) {
  const fromEl = players[activeIdx];
  const toEl = players[1 - activeIdx];
  const nextIdx = 1 - activeIdx;

  toEl.src = track.streamUrl;
  toEl.currentTime = 0;
  toEl.volume = 0;

  try {
    await toEl.play();
  } catch (e) {
    console.warn('play fail', e);
    $('footerInfo').textContent = 'не удалось воспроизвести';
    return;
  }

  activeIdx = nextIdx;
  state.currentTrack = track;
  state.lastTrackId = track.id;
  updateTrackUI(track);

  const start = performance.now();
  const fromVolStart = fromEl.volume;
  const step = () => {
    const p = Math.min(1, (performance.now() - start) / fadeMs);
    if (!state.muted) {
      toEl.volume = state.volume * p;
      fromEl.volume = fromVolStart * (1 - p);
    }
    if (p < 1) requestAnimationFrame(step);
    else { try { fromEl.pause(); fromEl.src = ''; } catch(e){} }
  };
  step();
}

async function startPlayback() {
  if (!tracksPool.length) await loadGenre(state.currentGenre);
  const track = pickNextTrack();
  if (!track) { $('footerInfo').textContent = 'нет треков'; return; }
  await crossfadeTo(track, 600);
  state.playing = true;
  updatePlayUI();
}

async function playNext() {
  if (!tracksPool.length) return;
  const track = pickNextTrack();
  if (!track) return;
  await crossfadeTo(track);
  state.playing = true;
  updatePlayUI();
  tg?.HapticFeedback?.impactOccurred('light');
}

function pausePlayback() {
  players[activeIdx].pause();
  state.playing = false;
  updatePlayUI();
}

async function resumePlayback() {
  try {
    await players[activeIdx].play();
    state.playing = true;
    updatePlayUI();
  } catch (e) { console.warn(e); }
}

async function togglePlay() {
  if (state.playing) pausePlayback();
  else if (state.currentTrack) await resumePlayback();
  else await startPlayback();
  tg?.HapticFeedback?.impactOccurred('light');
}

// ============================================================
// UI
// ============================================================
function updatePlayUI() {
  $('vinyl').classList.toggle('spinning', state.playing);
  $('glow').classList.toggle('active', state.playing);
  document.querySelector('.icon-play').style.display = state.playing ? 'none' : 'block';
  document.querySelector('.icon-pause').style.display = state.playing ? 'block' : 'none';
  $('footerInfo').textContent = state.playing ? 'playing' : 'paused';
}

function renderGenres() {
  const wrap = $('genresWrap');
  wrap.innerHTML = '';
  GENRES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'genre' + (g.key === state.currentGenre ? ' active' : '');
    btn.textContent = g.label;
    btn.addEventListener('click', async () => {
      if (g.key === state.currentGenre) return;
      state.currentGenre = g.key;
      renderGenres();
      if (state.playing) pausePlayback();
      state.currentTrack = null;
      await loadGenre(g.key);
      if (state.playing) await startPlayback();
      tg?.HapticFeedback?.selectionChanged();
    });
    wrap.appendChild(btn);
  });
}

// ============================================================
// THEME
// ============================================================
let theme = 'night';
$('themeBtn').addEventListener('click', () => {
  theme = theme === 'night' ? 'day' : 'night';
  document.documentElement.setAttribute('data-theme', theme);
  $('themeBtn').textContent = theme === 'night' ? '🌙' : '☀️';
});

// ============================================================
// WIRE UP
// ============================================================
$('playBtn').addEventListener('click', togglePlay);
$('nextBtn').addEventListener('click', playNext);
$('prevBtn').addEventListener('click', playNext); // prev = тоже next (случайный)

$('volumeSlider').addEventListener('input', e => {
  state.volume = parseInt(e.target.value, 10) / 100;
  if (!state.muted) players[activeIdx].volume = state.volume;
});

$('muteBtn').addEventListener('click', () => {
  state.muted = !state.muted;
  $('muteBtn').classList.toggle('muted', state.muted);
  players.forEach(p => p.volume = state.muted ? 0 : state.volume);
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
    e.preventDefault(); togglePlay();
  }
});

setInterval(() => {
  const el = players[activeIdx];
  const t = el && !isNaN(el.currentTime) ? el.currentTime : 0;
  const m = Math.floor(t / 60).toString().padStart(2, '0');
  const s = Math.floor(t % 60).toString().padStart(2, '0');
  $('elapsed').textContent = `${m}:${s}`;
}, 500);

// ============================================================
// INIT
// ============================================================
(async function init() {
  $('footerInfo').textContent = 'connecting to audius…';
  await selectHost();
  renderGenres();
  await loadGenre(state.currentGenre);
})();
</script>
</body>
</html>
