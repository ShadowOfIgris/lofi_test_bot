
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight FM — Dream Radio</title>
<style>
:root{color-scheme:dark;--bg:#090b17;--panel:#15182a;--text:#e8e9ff;--muted:#969bbd;--accent:#a89bff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29294d 0%,#101326 45%,#080a14 100%);color:var(--text);font:16px system-ui,sans-serif;display:flex;justify-content:center;padding:24px 14px}
main{width:100%;max-width:650px}
header{text-align:center;padding:20px 0 25px}
.logo{font-size:12px;letter-spacing:5px;color:#b9b2ff}
h1{font-size:clamp(32px,7vw,48px);margin:12px 0 5px;letter-spacing:2px}
.subtitle{color:var(--muted);font-size:14px}
.sky{height:155px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#28284a,#6d577b 60%,#25243e);margin-bottom:18px}
.moon{position:absolute;right:17%;top:20px;width:54px;height:54px;border-radius:50%;background:#fff0d5;box-shadow:0 0 35px #ffe6c588}
.city{position:absolute;bottom:0;width:100%;height:90px;display:flex;align-items:flex-end;gap:5px;padding:0 8px}
.building{flex:1;background:#111528;border-radius:3px 3px 0 0;position:relative}
.building:after{content:"";position:absolute;inset:9px 5px;background:repeating-linear-gradient(0deg,transparent 0 9px,#e8b9ff66 10px 13px);opacity:.65}
.panel{background:#121629eF;border:1px solid #ffffff13;border-radius:18px;padding:20px;margin:14px 0}
.label{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:12px}
.moods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
button{font:inherit;cursor:pointer;transition:.2s}
.mood{padding:14px 10px;text-align:left;border:1px solid #ffffff17;background:#1a1d33;color:var(--text);border-radius:12px}
.mood span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.mood.active{border-color:var(--accent);background:#7770b52b;box-shadow:inset 0 0 0 1px #a89bff22}
.now{display:flex;align-items:center;gap:14px}
.disc{width:65px;height:65px;flex-shrink:0;border-radius:50%;background:repeating-radial-gradient(circle,#26283b 0 4px,#101221 5px 8px);display:grid;place-items:center;border:2px solid #656080}
.disc:after{content:"";width:14px;height:14px;border-radius:50%;background:#c4b9ff}
.disc.playing{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.track{font-size:20px;font-weight:600}
.status{font-size:13px;color:var(--muted);margin-top:5px}
.controls{display:flex;gap:10px;margin-top:18px}
.mainbtn{flex:1;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#111126;font-weight:700}
.stopbtn{padding:14px 20px;border:1px solid #ffffff25;border-radius:12px;background:#20233a;color:var(--text)}
.setting{margin:19px 0}
.settingtop{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:9px}
.settingtop output{color:#c3bbff}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toggle{display:flex;gap:9px;align-items:center;color:#d6d7ed;font-size:14px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
footer{text-align:center;color:#747a9b;font-size:12px;padding:15px}
@media(max-width:420px){.panel{padding:16px}.moods{gap:7px}.mood{padding:12px 8px}.stopbtn{padding:12px}}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">YOUR PERSONAL NIGHT RADIO</div>
  <h1>MIDNIGHT FM</h1>
  <div class="subtitle">Somewhere between a dream and the city lights.</div>
</header>

<div class="sky" aria-hidden="true">
  <div class="moon"></div>
  <div class="city" id="city"></div>
</div>

<section class="panel">
  <div class="label">CHOOSE YOUR NIGHT</div>
  <div class="moods">
    <button class="mood active" data-mood="dream">✦ Dream City<span>Мечтательные клавиши</span></button>
    <button class="mood" data-mood="rain">☂ Rainy Window<span>Дождь за окном</span></button>
    <button class="mood" data-mood="drive">⌁ Night Drive<span>Ночная дорога</span></button>
    <button class="mood" data-mood="cafe">☕ Quiet Cafe<span>Тихое кафе</span></button>
  </div>
</section>

<section class="panel">
  <div class="now">
    <div class="disc" id="disc"></div>
    <div>
      <div class="track" id="track">Dream City</div>
      <div class="status" id="status">Радио выключено · бесконечный эфир</div>
    </div>
  </div>
  <div class="controls">
    <button class="mainbtn" id="play">▶ Включить радио</button>
    <button class="stopbtn" id="stop">■ Стоп</button>
  </div>
</section>

<section class="panel">
  <div class="label">SOUND DESIGN</div>
  <div class="setting">
    <div class="settingtop"><label for="tempo">Темп</label><output id="tempoValue">72 BPM</output></div>
    <input id="tempo" type="range" min="55" max="100" value="72">
  </div>
  <div class="setting">
    <div class="settingtop"><label for="ambience">Атмосфера и дождь</label><output id="ambienceValue">35%</output></div>
    <input id="ambience" type="range" min="0" max="100" value="35">
  </div>
  <div class="toggles">
    <label class="toggle"><input id="drums" type="checkbox" checked> Мягкий ритм</label>
    <label class="toggle"><input id="melody" type="checkbox" checked> Мелодия</label>
    <label class="toggle"><input id="air" type="checkbox" checked> Ночной воздух</label>
    <label class="toggle"><input id="warm" type="checkbox" checked> Тёплый звук</label>
  </div>
</section>
<footer>GENERATIVE MUSIC · EVERY NIGHT IS DIFFERENT</footer>
</main>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const scenes = {
  dream: {
    label: "Dream City", bpm: 72, wave: "triangle",
    chords: [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]],
    melody: [76,72,79,76,74,72,67,72,76,79,81,79,76,72,71,67],
    bass: [36,43,33,38]
  },
  rain: {
    label: "Rainy Window", bpm: 66, wave: "sine",
    chords: [[60,63,67,70],[56,60,63,67],[53,56,60,63],[58,62,65,69]],
    melody: [72,75,79,75,72,70,67,70,72,75,77,75,70,67,65,67],
    bass: [36,32,29,34]
  },
  drive: {
    label: "Night Drive", bpm: 84, wave: "triangle",
    chords: [[57,60,64,67],[53,57,60,64],[55,59,62,65],[52,55,59,62]],
    melody: [76,76,72,67,72,76,79,76,74,74,71,67,71,74,79,74],
    bass: [33,29,31,28]
  },
  cafe: {
    label: "Quiet Cafe", bpm: 68, wave: "sine",
    chords: [[60,64,67,74],[57,60,64,69],[55,59,62,69],[53,57,60,67]],
    melody: [72,76,79,76,74,72,69,72,76,79,81,79,76,74,72,69],
    bass: [36,33,31,29]
  }
};

let mood = "dream";
let bpm = 72;
let audio = null;
let master = null;
let musicBus = null;
let ambienceBus = null;
let timer = null;
let nextTime = 0;
let step = 0;
let bar = 0;
let noiseSource = null;
let running = false;

function makeCity() {
  const city = $("city");
  for (let i = 0; i < 22; i++) {
    const b = document.createElement("div");
    b.className = "building";
    b.style.height = (25 + ((i * 37 + 19) % 65)) + "px";
    city.appendChild(b);
  }
}

function noteFrequency(note) {
  return 440 * Math.pow(2, (note - 69) / 12);
}

function makeNoiseBuffer(ctx) {
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < data.length; i++) {
    last = last * 0.97 + (Math.random() * 2 - 1) * 0.03;
    data[i] = last * 4;
  }
  return buffer;
}

function setGain(param, value, time, duration = 0.2) {
  param.cancelScheduledValues(time);
  param.setTargetAtTime(value, time, duration);
}

function playTone(freq, time, duration, volume, wave = "sine", bus = musicBus, endFreq = null) {
  if (!audio || !bus) return;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(freq, time);
  if (endFreq !== null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), time + duration);
  }
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), time + 0.025);
  gain.gain.setTargetAtTime(0.0001, time + duration * 0.65, Math.max(0.03, duration * 0.2));
  osc.connect(gain);
  gain.connect(bus);
  osc.start(time);
  osc.stop(time + duration + 0.25);
}

function playPad(notes, time, duration) {
  notes.forEach((note, index) => {
    playTone(noteFrequency(note), time, duration, index === 0 ? 0.045 : 0.026, "sine");
    playTone(noteFrequency(note) * 2, time, duration * 0.8, 0.008, "sine");
  });
}

function playBass(note, time, duration) {
  playTone(noteFrequency(note), time, duration, 0.12, "triangle");
}

function playKick(time) {
  playTone(110, time, 0.22, 0.23, "sine", musicBus, 42);
}

function playSnare(time) {
  if (!audio) return;
  playTone(180, time, 0.09, 0.045, "triangle");
  const noise = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  noise.buffer = makeNoiseBuffer(audio);
  filter.type = "highpass";
  filter.frequency.value = 1600;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.linearRampToValueAtTime(0.035, time + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.11);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(musicBus);
  noise.start(time);
  noise.stop(time + 0.12);
}

function playHat(time) {
  if (!audio) return;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = makeNoiseBuffer(audio);
  filter.type = "highpass";
  filter.frequency.value = 6500;
  gain.gain.setValueAtTime(0.018, time);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(musicBus);
  src.start(time);
  src.stop(time + 0.04);
}

function scheduleStep(time) {
  const scene = scenes[mood];
  const beat = 60 / bpm;
  const s = step % 16;

  if (s === 0) {
    playPad(scene.chords[bar % scene.chords.length], time, beat * 7.5);
  }

  if (s === 0 || s === 8) {
    playBass(scene.bass[bar % scene.bass.length], time, beat * 1.7);
  } else if (s === 6 || s === 14) {
    playBass(scene.bass[bar % scene.bass.length] + 12, time, beat * 0.65);
  }

  if ($("drums").checked) {
    if (s === 0 || s === 8) playKick(time);
    if (s === 4 || s === 12) playSnare(time);
    if (s % 2 === 0) playHat(time);
  }

  if ($("melody").checked && [0,2,3,5,7,8,10,11,13,15].includes(s)) {
    const note = scene.melody[s];
    const duration = beat * (s % 4 === 0 ? 1.35 : 0.7);
    playTone(noteFrequency(note), time, duration, 0.055, scene.wave);
  }

  step++;
  if (step % 16 === 0) bar++;
}

function scheduler() {
  if (!audio || !running) return;
  while (nextTime < audio.currentTime + 0.12) {
    scheduleStep(nextTime);
    nextTime += 30 / bpm;
  }
}

function updateAtmosphere() {
  if (!audio || !ambienceBus) return;
  const level = Number($("ambience").value) / 100;
  const air = $("air").checked;
  const amount = air ? level * 0.035 : level * 0.006;
  setGain(ambienceBus.gain, amount, audio.currentTime);
  $("ambienceValue").textContent = $("ambience").value + "%";
}

function updateTrack() {
  $("track").textContent = scenes[mood].label;
  $("status").textContent = running
    ? "Сейчас играет · бесконечный эфир"
    : "Радио выключено · бесконечный эфир";
  document.querySelectorAll(".mood").forEach(button => {
    button.classList.toggle("active", button.dataset.mood === mood);
  });
}

async function startRadio() {
  try {
    if (!audio) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        $("status").textContent = "Браузер не поддерживает Web Audio";
        return;
      }

      audio = new AudioContextClass();
      master = audio.createGain();
      musicBus = audio.createGain();
      ambienceBus = audio.createGain();

      const compressor = audio.createDynamicsCompressor();
      compressor.threshold.value = -22;
      compressor.knee.value = 18;
      compressor.ratio.value = 3;
      compressor.attack.value = 0.01;
      compressor.release.value = 0.25;

      musicBus.connect(master);
      ambienceBus.connect(master);
      master.connect(compressor);
      compressor.connect(audio.destination);
      master.gain.value = 0.8;

      const noise = audio.createBufferSource();
      const filter = audio.createBiquadFilter();
      noise.buffer = makeNoiseBuffer(audio);
      noise.loop = true;
      filter.type = "lowpass";
      filter.frequency.value = 900;
      noise.connect(filter);
      filter.connect(ambienceBus);
      noise.start();
      noiseSource = noise;
    }

    await audio.resume();
    if (running) return;

    running = true;
    nextTime = audio.currentTime + 0.08;
    updateAtmosphere();
    scheduler();
    timer = window.setInterval(scheduler, 40);
    $("disc").classList.add("playing");
    $("play").textContent = "♫ Радио играет";
    updateTrack();
  } catch (error) {
    console.error(error);
    $("status").textContent = "Не удалось запустить звук. Попробуй ещё раз.";
  }
}

function stopRadio() {
  running = false;
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }
  if (audio && master) {
    setGain(master.gain, 0.0001, audio.currentTime, 0.04);
    window.setTimeout(() => {
      if (!running && audio && master) master.gain.setTargetAtTime(0.8, audio.currentTime, 0.03);
    }, 100);
  }
  $("disc").classList.remove("playing");
  $("play").textContent = "▶ Включить радио";
  updateTrack();
}

document.querySelectorAll(".mood").forEach(button => {
  button.addEventListener("click", () => {
    mood = button.dataset.mood;
    bpm = Number($("tempo").value);
    updateTrack();
  });
});

$("play").addEventListener("click", startRadio);
$("stop").addEventListener("click", stopRadio);

$("tempo").addEventListener("input", event => {
  bpm = Number(event.target.value);
  $("tempoValue").textContent = bpm + " BPM";
});

$("ambience").addEventListener("input", updateAtmosphere);
["air","drums","melody","warm"].forEach(id => {
  $(id).addEventListener("change", () => {
    if (audio) updateAtmosphere();
    if (audio && musicBus) {
      musicBus.gain.setTargetAtTime(
        $("warm").checked ? 1 : 0.7,
        audio.currentTime,
        0.15
      );
    }
  });
});

makeCity();
updateTrack();
})();
</script>
</body>
</html>
