
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight FM</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #090d18;
    color: #e9e7f2;
    font-family: Georgia, "Times New Roman", serif;
  }

  .radio {
    width: min(100%, 470px);
    text-align: center;
    padding: 34px 28px;
    border: 1px solid rgba(177, 190, 230, .15);
    border-radius: 22px;
    background: linear-gradient(180deg, #151b2b, #0c1120);
    box-shadow: 0 25px 90px #0008;
  }

  .sky {
    height: 150px;
    position: relative;
    overflow: hidden;
    margin-bottom: 24px;
    border-radius: 14px;
    background: linear-gradient(180deg, #202d49, #101729 75%);
  }

  .moon {
    position: absolute;
    top: 23px;
    right: 24%;
    width: 39px;
    height: 39px;
    border-radius: 50%;
    background: #e3e0d2;
    box-shadow: 0 0 28px #d9d9e455;
  }

  .stars {
    position: absolute;
    inset: 0;
    opacity: .65;
    background-image:
      radial-gradient(1px 1px at 15% 22%, #fff, transparent),
      radial-gradient(1px 1px at 35% 48%, #fff, transparent),
      radial-gradient(1px 1px at 70% 19%, #fff, transparent),
      radial-gradient(1px 1px at 82% 54%, #fff, transparent),
      radial-gradient(1px 1px at 52% 15%, #fff, transparent),
      radial-gradient(1px 1px at 25% 68%, #fff, transparent);
  }

  .buildings {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 76px;
    background:
      linear-gradient(90deg,
        #0a1020 0 8%, transparent 8% 10%,
        #0a1020 10% 19%, transparent 19% 22%,
        #0a1020 22% 34%, transparent 34% 36%,
        #0a1020 36% 43%, transparent 43% 46%,
        #0a1020 46% 59%, transparent 59% 62%,
        #0a1020 62% 70%, transparent 70% 73%,
        #0a1020 73% 87%, transparent 87% 90%,
        #0a1020 90% 100%);
    clip-path: polygon(
      0 35%, 8% 35%, 8% 15%, 19% 15%, 19% 44%,
      27% 44%, 27% 0, 35% 0, 35% 38%, 45% 38%,
      45% 20%, 55% 20%, 55% 48%, 64% 48%, 64% 9%,
      74% 9%, 74% 34%, 84% 34%, 84% 18%,
      100% 18%, 100% 100%, 0 100%);
  }

  h1 {
    font-weight: normal;
    font-size: 32px;
    letter-spacing: 3px;
    margin: 0 0 8px;
  }

  .subtitle {
    color: #929bb5;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 25px;
  }

  .track {
    min-height: 25px;
    color: #c7cbe0;
    font-size: 17px;
    margin-bottom: 24px;
  }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 27px;
  }

  button {
    border: 1px solid #65708d66;
    border-radius: 30px;
    padding: 13px 20px;
    background: #222c43;
    color: #f0eff8;
    font-size: 14px;
    cursor: pointer;
    transition: background .2s, transform .2s;
  }

  button:hover {
    background: #34415f;
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: .5;
    cursor: wait;
  }

  #play {
    min-width: 125px;
    background: #d5d5df;
    color: #101523;
    border-color: transparent;
  }

  .volume {
    display: flex;
    align-items: center;
    gap: 13px;
    color: #9ca5bd;
    font-family: Arial, sans-serif;
    font-size: 12px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: #b8c1dd;
    cursor: pointer;
  }

  .status {
    min-height: 18px;
    margin-top: 22px;
    color: #7986a5;
    font: 12px Arial, sans-serif;
  }
</style>
</head>
<body>

<main class="radio">
  <div class="sky">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="buildings"></div>
  </div>

  <h1>Midnight FM</h1>
  <div class="subtitle">late night radio</div>

  <div class="track" id="track">A quiet night somewhere</div>

  <div class="controls">
    <button id="play">▶ Play</button>
    <button id="next">Next Track ↗</button>
  </div>

  <div class="volume">
    <span>VOL</span>
    <input id="volume" type="range" min="0" max="1"
           step="0.01" value="0.65">
  </div>

  <div class="status" id="status">Нажми Play, чтобы начать</div>
</main>

<script>
(() => {
  const FILES = {
    piano: "Presets/piano.wav",
    drums: "Presets/drums.wav",
    bass: "Presets/bass.wav",
    ambience: "Presets/ambience.mp3"
  };

  const $ = id => document.getElementById(id);
  const playButton = $("play");
  const nextButton = $("next");
  const volumeSlider = $("volume");
  const status = $("status");
  const trackTitle = $("track");

  let ctx = null;
  let buffers = {};
  let master = null;
  let currentTrack = null;
  let playing = false;
  let loading = false;
  let variationTimer = null;
  let trackNumber = 0;
  let requestId = 0;

  const titles = [
    "A quiet night somewhere",
    "Rain on the window",
    "Last train home",
    "Blue lights, empty streets",
    "Nothing to hurry for",
    "The city after midnight",
    "One more hour awake",
    "Somewhere in the distance",
    "Lights across the river",
    "A familiar kind of silence",
    "Walking without a destination",
    "Until the morning comes"
  ];

  const random = (min, max) =>
    min + Math.random() * (max - min);

  function setStatus(message) {
    status.textContent = message;
  }

  async function initialize() {
    if (ctx) {
      if (ctx.state === "suspended") await ctx.resume();
      return;
    }

    ctx = new (window.AudioContext || window.webkitAudioContext)();

    master = ctx.createGain();
    master.gain.value = Number(volumeSlider.value);
    master.connect(ctx.destination);

    setStatus("Загружаем аудиозаписи…");

    const entries = Object.entries(FILES);

    const loaded = await Promise.all(entries.map(async ([name, url]) => {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("Не удалось загрузить " + url);
      }

      const data = await response.arrayBuffer();
      const decoded = await ctx.decodeAudioData(data);
      return [name, decoded];
    }));

    buffers = Object.fromEntries(loaded);
  }

  function stopGroup(group, fadeSeconds = 1.5) {
    if (!group) return;

    const now = ctx.currentTime;
    const end = now + fadeSeconds;

    group.layers.forEach(layer => {
      try {
        layer.gain.gain.cancelScheduledValues(now);
        layer.gain.gain.setValueAtTime(
          layer.gain.gain.value, now
        );
        layer.gain.gain.linearRampToValueAtTime(0, end);
      } catch (_) {}

      try {
        layer.source.stop(end + 0.08);
      } catch (_) {}
    });
  }

  function makeLayer(name, group, options) {
    const buffer = buffers[name];
    if (!buffer) return null;

    const source = ctx.createBufferSource();
    const gain = ctx.createGain();

    source.buffer = buffer;
    source.loop = true;

    // Pick a new section on each track. Use the same relative
    // position for the musical layers to help preserve alignment.
    const segmentLength = Math.min(
      options.segmentLength || 16,
      buffer.duration
    );

    const maxStart = Math.max(0, buffer.duration - segmentLength);
    const start = maxStart * options.startFraction;

    source.loopStart = start;
    source.loopEnd = start + segmentLength;

    // Tiny changes only: enough to refresh the texture, not
    // enough to make the recordings sound unnaturally pitched.
    source.playbackRate.value = options.rate || 1;

    gain.gain.value = 0;
    source.connect(gain);
    gain.connect(group.bus);

    source.start(0, start);
    return { source, gain, name };
  }

  function chooseSection() {
    const musicalNames = ["piano", "drums", "bass"];
    const shortest = Math.min(
      ...musicalNames.map(name => buffers[name].duration)
    );

    const segmentLength = Math.min(18, shortest);
    const maxStart = Math.max(0, shortest - segmentLength);

    return {
      segmentLength,
      startFraction: Math.random(),
      maxStart
    };
  }

  function startTrack(fadeIn = 2.5) {
    const now = ctx.currentTime;
    const section = chooseSection();

    const bus = ctx.createGain();
    bus.gain.value = 1;
    bus.connect(master);

    const group = { bus, layers: [] };

    const rate = random(0.985, 1.015);

    // Recorded samples stay at the centre of the sound.
    // Gains are deliberately restrained so the rain won't
    // drown out the music.
    const settings = {
      piano: random(0.32, 0.47),
      drums: random(0.12, 0.22),
      bass: random(0.16, 0.27)
    };

    ["piano", "drums", "bass"].forEach(name => {
      const layer = makeLayer(name, group, {
        segmentLength: section.segmentLength,
        startFraction: section.startFraction,
        rate
      });

      if (layer) {
        layer.gain.gain.setValueAtTime(0, now);
        layer.gain.gain.linearRampToValueAtTime(
          settings[name], now + fadeIn
        );
        group.layers.push(layer);
      }
    });

    // Ambient audio is much quieter than the instruments.
    const ambience = makeLayer("ambience", group, {
      segmentLength: buffers.ambience.duration,
      startFraction: 0,
      rate: 1
    });

    if (ambience) {
      ambience.gain.gain.setValueAtTime(0, now);
      ambience.gain.gain.linearRampToValueAtTime(
        0.035, now + fadeIn + 1
      );
      group.layers.push(ambience);
    }

    return { ...group, settings };
  }

  function varyArrangement() {
    if (!playing || !currentTrack) return;

    const now = ctx.currentTime;
    const group = currentTrack;

    // Small arrangement changes: a layer can briefly soften,
    // then return. No abrupt cuts.
    group.layers.forEach(layer => {
      let target;

      if (layer.name === "ambience") {
        target = random(0.018, 0.038);
      } else {
        const base = group.settings[layer.name] || 0.2;
        const drop = Math.random() < 0.22;
        target = drop ? base * random(0.12, 0.35)
                      : base * random(0.75, 1.08);
      }

      const param = layer.gain.gain;
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(target, now + random(2, 4));
    });

    // The next small change comes after a variable interval.
    clearTimeout(variationTimer);
    variationTimer = setTimeout(
      varyArrangement,
      random(9000, 18000)
    );
  }

  async function play() {
    if (loading) return;
    loading = true;
    playButton.disabled = true;

    const thisRequest = ++requestId;

    try {
      await initialize();
      if (thisRequest !== requestId) return;

      if (!playing) {
        playing = true;
        currentTrack = startTrack(3);
        trackNumber++;

        trackTitle.textContent = titles[
          Math.floor(Math.random() * titles.length)
        ];

        playButton.textContent = "Ⅱ Pause";
        setStatus("Playing · midnight mood");

        clearTimeout(variationTimer);
        variationTimer = setTimeout(varyArrangement, 12000);
      }
    } catch (error) {
      console.error(error);
      setStatus("Ошибка загрузки. Проверь папку Presets и имена файлов.");
      playing = false;
    } finally {
      loading = false;
      playButton.disabled = false;
    }
  }

  function pause() {
    playing = false;
    clearTimeout(variationTimer);

    if (currentTrack) {
      stopGroup(currentTrack, 1.2);
      currentTrack = null;
    }

    playButton.textContent = "▶ Play";
    setStatus("Paused");
  }

  async function nextTrack() {
    if (loading) return;
    loading = true;
    nextButton.disabled = true;

    try {
      await initialize();

      if (!playing) {
        playing = true;
        currentTrack = startTrack(2.5);
        playButton.textContent = "Ⅱ Pause";
      } else {
        const oldTrack = currentTrack;
        const newTrack = startTrack(3.5);

        currentTrack = newTrack;
        stopGroup(oldTrack, 3.5);
      }

      trackNumber++;
      trackTitle.textContent = titles[
        Math.floor(Math.random() * titles.length)
      ];

      setStatus("New mix · take your time");

      clearTimeout(variationTimer);
      variationTimer = setTimeout(varyArrangement, 12000);
    } catch (error) {
      console.error(error);
      setStatus("Не удалось загрузить музыку. Проверь файлы в Presets.");
    } finally {
      loading = false;
      nextButton.disabled = false;
    }
  }

  playButton.addEventListener("click", () => {
    if (playing) pause();
    else play();
  });

  nextButton.addEventListener("click", nextTrack);

  volumeSlider.addEventListener("input", () => {
    if (master && ctx) {
      master.gain.setTargetAtTime(
        Number(volumeSlider.value),
        ctx.currentTime,
        0.04
      );
    }
  });
})();
</script>
</body>
</html>
