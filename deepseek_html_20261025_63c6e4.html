<!DOCTYPE html>
<html lang="ru" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>lofi.player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root,[data-theme="night"]{--bg:#121212;--surface:#1E1E1E;--surface-2:#2A2A2A;--border:#333;--text:#E0D8D0;--text-muted:#8A7A68;--text-dim:#5C5045;--accent:#C9A87C;--accent-2:#9B7FA6;--accent-glow:rgba(201,168,124,.2);--btn-primary-text:#121212}
[data-theme="day"]{--bg:#F5EFE6;--surface:#FFFFFF;--surface-2:#F0E8DC;--border:#D8CFC2;--text:#3D3028;--text-muted:#7A6B5E;--text-dim:#A89888;--accent:#8B5E3C;--accent-2:#B87D9E;--accent-glow:rgba(139,94,60,.15);--btn-primary-text:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'SF Mono','Courier New',monospace;overflow:hidden;user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(160,130,180,.06),transparent 50%),var(--bg);z-index:-1}
.app{height:100dvh;display:flex;flex-direction:column;padding:12px 16px 12px;max-width:520px;margin:0 auto;gap:10px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.brand-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.header-btns{display:flex;gap:6px}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}

/* Player */
.player{display:flex;gap:14px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;flex-shrink:0}
.vinyl-wrap{position:relative;width:60px;height:60px;flex-shrink:0}
.vinyl{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#0a0a0a 0%,#0a0a0a 15%,transparent 15%),radial-gradient(circle,var(--accent-2) 15%,var(--accent-2) 35%,transparent 35%),repeating-radial-gradient(circle,#1a1a1a 0px,#1a1a1a 1px,#0d0d0d 1px,#0d0d0d 2px);animation:spin 5s linear infinite;animation-play-state:paused;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.vinyl.spinning{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.now{flex:1;overflow:hidden;min-width:0}
.now-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.now-meta{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.controls{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);background:none;transition:transform .15s}
.btn:active{transform:scale(.93)}
.btn svg{width:18px;height:18px}
.btn-play{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--btn-primary-text);box-shadow:0 3px 12px var(--accent-glow)}
.btn-play svg{width:20px;height:20px}
.btn-ctrl{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border)}

/* Progress */
.progress{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;flex-shrink:0}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s}

/* Genres */
.genres{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;flex-shrink:0}
.genres::-webkit-scrollbar{display:none}
.genre{flex-shrink:0;padding:6px 12px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:6px}
.genre.active{background:var(--accent);color:var(--btn-primary-text);border-color:var(--accent)}
.genre-count{font-size:8px;opacity:.6}
.genre-add{padding:6px 10px;background:none;border:1px dashed var(--border);color:var(--text-muted);border-radius:16px;cursor:pointer;font-size:14px;line-height:1}
.genre-del{color:inherit;font-size:12px;background:none;border:none;cursor:pointer;opacity:.6;padding:0 0 0 2px}
.genre-del:hover{opacity:1}

/* Tracklist */
.tracklist{flex:1;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;min-height:0;-webkit-overflow-scrolling:touch}
.tracklist::-webkit-scrollbar{width:4px}
.tracklist::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:2px}
.track{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text);transition:background .15s;min-width:0}
.track:hover{background:var(--surface-2)}
.track.active{background:var(--surface-2);color:var(--accent)}
.track-num{font-size:9px;color:var(--text-dim);min-width:16px;flex-shrink:0}
.track.active .track-num{color:var(--accent)}
.track-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.track-dur{font-size:10px;color:var(--text-dim);flex-shrink:0;margin-left:auto}
.track-genre-sel{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-family:inherit;font-size:10px;flex-shrink:0;max-width:90px}
.track-empty{text-align:center;color:var(--text-dim);padding:24px 12px;font-size:11px;line-height:1.6}

/* Bottom row */
.bottom-row{display:flex;gap:8px;align-items:center;flex-shrink:0}
.upload-btn{flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px}
.upload-btn:active{background:var(--surface-2)}
.upload-btn svg{width:14px;height:14px}
.edit-btn{padding:10px 14px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;cursor:pointer;font-family:inherit;font-size:11px}
.edit-btn.active{background:var(--accent);color:var(--btn-primary-text);border-color:var(--accent)}

/* Volume */
.volume-row{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mute-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;flex-shrink:0}
.mute-btn.muted{opacity:.35}
.volume-slider{flex:1;height:3px;-webkit-appearance:none;appearance:none;background:var(--surface-2);border-radius:2px;outline:none;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.volume-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:none}

/* Footer */
.footer{display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);padding-top:6px;border-top:1px solid var(--border);flex-shrink:0}
.footer-time{color:var(--accent);font-variant-numeric:tabular-nums}

/* Hidden */
.hidden{display:none !important}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand"><span class="brand-dot"></span><span>lofi.player</span></div>
    <div class="header-btns">
      <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
    </div>
  </header>

  <div class="player">
    <div class="vinyl-wrap"><div class="vinyl" id="vinyl"></div></div>
    <div class="now">
      <div class="now-title" id="nowTitle">Нет треков</div>
      <div class="now-meta" id="nowMeta">загрузите папку с музыкой</div>
    </div>
    <div class="controls">
      <button class="btn btn-ctrl" id="prevBtn" title="Назад">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn btn-play" id="playBtn" title="Играть">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button class="btn btn-ctrl" id="nextBtn" title="Вперёд">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>
  </div>

  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

  <div class="genres" id="genresWrap"></div>

  <div class="tracklist" id="tracklist">
    <div class="track-empty">Пока пусто.<br>Нажмите «Загрузить папку» внизу.</div>
  </div>

  <div class="bottom-row">
    <button class="upload-btn" id="uploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Загрузить папку
    </button>
    <button class="edit-btn" id="editBtn">✎ Режим</button>
    <input type="file" id="fileInput" webkitdirectory directory multiple accept="audio/*" class="hidden">
  </div>

  <div class="volume-row">
    <button class="mute-btn" id="muteBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
    </button>
    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
  </div>

  <footer class="footer"><span id="footerInfo">готов</span><span class="footer-time" id="elapsed">00:00</span></footer>
</div>

<script>
// ============================================================
//  TELEGRAM
// ============================================================
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#121212'); tg.setBackgroundColor('#121212'); } catch(e){} }

const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
const state = {
  genres: ['Chillhop', 'Jazzhop', 'Ambient'],   // имена жанров
  currentGenre: 'Chillhop',
  tracks: [],           // { id, name, artist, duration, genre, url, file, objUrl }
  currentIdx: -1,
  playing: false,
  editMode: false,
  volume: 0.7,
  muted: false,
  shuffle: false,
  repeat: 'off'         // 'off' | 'all' | 'one'
};

// ============================================================
//  AUDIO
// ============================================================
const audio = new Audio();
audio.volume = state.volume;
let elapsedStart = 0, elapsedAccum = 0;

audio.addEventListener('ended', () => {
  if (state.repeat === 'one') {
    audio.currentTime = 0;
    audio.play();
  } else {
    playNext();
  }
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration && isFinite(audio.duration)) {
    const pct = (audio.currentTime / audio.duration) * 100;
    $('progressFill').style.width = pct + '%';
  }
});

audio.addEventListener('play', () => {
  state.playing = true;
  updatePlayUI();
  elapsedStart = Date.now() - audio.currentTime * 1000;
});
audio.addEventListener('pause', () => {
  state.playing = false;
  updatePlayUI();
});
audio.addEventListener('error', () => {
  $('footerInfo').textContent = 'ошибка воспроизведения';
});

// ============================================================
//  ЖАНРЫ — localStorage
// ============================================================
function saveGenres() {
  try { localStorage.setItem('lofi_genres', JSON.stringify(state.genres)); } catch(e){}
}
function loadGenres() {
  try {
    const raw = localStorage.getItem('lofi_genres');
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) {
        state.genres = arr;
        if (!state.genres.includes(state.currentGenre)) state.currentGenre = state.genres[0];
      }
    }
  } catch(e){}
}

// ============================================================
//  RENDER
// ============================================================
function renderGenres() {
  const wrap = $('genresWrap');
  wrap.innerHTML = '';
  state.genres.forEach(g => {
    const count = state.tracks.filter(t => t.genre === g).length;
    const btn = document.createElement('button');
    btn.className = 'genre' + (g === state.currentGenre ? ' active' : '');
    btn.innerHTML = `${g} <span class="genre-count">${count}</span>` +
      (state.editMode ? ` <span class="genre-del" data-del="${g}">✕</span>` : '');
    btn.addEventListener('click', e => {
      if (e.target.dataset.del) {
        deleteGenre(e.target.dataset.del);
        return;
      }
      state.currentGenre = g;
      renderGenres();
      renderTracks();
    });
    wrap.appendChild(btn);
  });
  // Кнопка +
  const add = document.createElement('button');
  add.className = 'genre-add';
  add.textContent = '+';
  add.title = 'Добавить жанр';
  add.addEventListener('click', addGenre);
  wrap.appendChild(add);
}

function renderTracks() {
  const list = $('tracklist');
  const items = state.tracks.filter(t => t.genre === state.currentGenre);
  if (!items.length) {
    list.innerHTML = '<div class="track-empty">В этом жанре пока пусто.<br>Загрузите папку или перетащите трек в другой жанр.</div>';
    return;
  }
  list.innerHTML = '';
  items.forEach((track, i) => {
    const globalIdx = state.tracks.indexOf(track);
    const div = document.createElement('div');
    div.className = 'track' + (state.playing && state.currentIdx === globalIdx ? ' active' : '');
    const num = `<span class="track-num">${i + 1}</span>`;
    const title = `<span class="track-title">${escapeHtml(track.name)}</span>`;
    const dur = `<span class="track-dur">${fmtDur(track.duration)}</span>`;
    let edit = '';
    if (state.editMode) {
      const opts = state.genres.map(g => `<option value="${escapeHtml(g)}"${g === track.genre ? ' selected' : ''}>${escapeHtml(g)}</option>`).join('');
      edit = `<select class="track-genre-sel" data-idx="${globalIdx}">${opts}</select>`;
    }
    div.innerHTML = num + title + dur + edit;
    div.addEventListener('click', e => {
      if (e.target.classList.contains('track-genre-sel')) return;
      playTrack(globalIdx);
    });
    list.appendChild(div);
  });

  // Обработчик смены жанра у трека
  list.querySelectorAll('.track-genre-sel').forEach(sel => {
    sel.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      if (state.tracks[idx]) {
        state.tracks[idx].genre = e.target.value;
        renderGenres();
        renderTracks();
      }
    });
  });
}

function renderAll() {
  renderGenres();
  renderTracks();
}

// ============================================================
//  PLAYER
// ============================================================
function playTrack(idx) {
  const track = state.tracks[idx];
  if (!track) return;
  state.currentIdx = idx;
  audio.src = track.url;
  audio.play().catch(e => console.warn('play fail', e));
  $('nowTitle').textContent = track.name;
  $('nowMeta').textContent = `${track.genre} · ${track.artist || 'unknown'}`;
  renderTracks();
  $('footerInfo').textContent = 'играет';
}

function playNext() {
  if (!state.tracks.length) return;
  if (state.shuffle) {
    let next;
    do { next = Math.floor(Math.random() * state.tracks.length); }
    while (next === state.currentIdx && state.tracks.length > 1);
    playTrack(next);
  } else {
    const next = (state.currentIdx + 1) % state.tracks.length;
    playTrack(next);
  }
}

function playPrev() {
  if (!state.tracks.length) return;
  const prev = (state.currentIdx - 1 + state.tracks.length) % state.tracks.length;
  playTrack(prev);
}

function togglePlay() {
  if (!state.tracks.length) { $('footerInfo').textContent = 'сначала загрузите папку'; return; }
  if (state.currentIdx === -1) {
    // Первый трек текущего жанра
    const items = state.tracks.filter(t => t.genre === state.currentGenre);
    if (!items.length) { $('footerInfo').textContent = 'в жанре нет треков'; return; }
    playTrack(state.tracks.indexOf(items[0]));
    return;
  }
  if (audio.paused) audio.play().catch(e => console.warn(e));
  else audio.pause();
}

function updatePlayUI() {
  $('vinyl').classList.toggle('spinning', state.playing);
  document.querySelector('.icon-play').style.display = state.playing ? 'none' : 'block';
  document.querySelector('.icon-pause').style.display = state.playing ? 'block' : 'none';
  if (!state.playing) $('footerInfo').textContent = 'пауза';
}

// ============================================================
//  ЗАГРУЗКА ФАЙЛОВ
// ============================================================
async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => {
    const ext = f.name.split('.').pop().toLowerCase();
    return ['mp3','wav','ogg','m4a','aac','flac'].includes(ext);
  });
  if (!files.length) {
    $('footerInfo').textContent = 'в папке нет аудиофайлов';
    return;
  }

  $('footerInfo').textContent = `загрузка ${files.length} файлов…`;

  for (const file of files) {
    const name = file.name.replace(/\.[^.]+$/, '');
    let artist = '';
    let title = name;
    // Пытаемся выделить "Artist - Title"
    if (name.includes(' - ')) {
      const parts = name.split(' - ');
      if (parts.length >= 2) {
        artist = parts[0].trim();
        title = parts.slice(1).join(' - ').trim();
      }
    }
    const url = URL.createObjectURL(file);

    // Узнать длительность
    const duration = await getDuration(url);

    state.tracks.push({
      id: 'trk_' + Math.random().toString(36).slice(2, 9),
      name: title,
      artist,
      duration,
      genre: state.currentGenre,
      url,
      file
    });
  }

  renderAll();
  $('footerInfo').textContent = `добавлено ${files.length} треков`;
  setTimeout(() => $('footerInfo').textContent = 'готов', 2000);
}

function getDuration(url) {
  return new Promise(resolve => {
    const a = new Audio();
    a.src = url;
    const done = () => resolve(a.duration || 0);
    a.addEventListener('loadedmetadata', done, { once: true });
    a.addEventListener('error', () => resolve(0), { once: true });
    setTimeout(() => resolve(a.duration || 0), 4000);
  });
}

// ============================================================
//  ЖАНРЫ — CRUD
// ============================================================
function addGenre() {
  const name = prompt('Название нового жанра:', 'Новый жанр');
  if (!name) return;
  const trimmed = name.trim();
  if (!trimmed || state.genres.includes(trimmed)) return;
  state.genres.push(trimmed);
  saveGenres();
  renderAll();
}

function deleteGenre(name) {
  if (state.genres.length <= 1) {
    $('footerInfo').textContent = 'должен остаться хотя бы один жанр';
    return;
  }
  const count = state.tracks.filter(t => t.genre === name).length;
  if (count > 0 && !confirm(`В жанре «${name}» ${count} треков. Они переместятся в «${state.genres.find(g => g !== name)}». Продолжить?`)) return;
  const fallback = state.genres.find(g => g !== name);
  state.tracks.forEach(t => { if (t.genre === name) t.genre = fallback; });
  state.genres = state.genres.filter(g => g !== name);
  if (state.currentGenre === name) state.currentGenre = state.genres[0];
  saveGenres();
  renderAll();
}

// ============================================================
//  ХЕЛПЕРЫ
// ============================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDur(sec) {
  if (!sec || !isFinite(sec)) return '—:—';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

// ============================================================
//  ТЕМА
// ============================================================
let theme = 'night';
$('themeBtn').addEventListener('click', () => {
  theme = theme === 'night' ? 'day' : 'night';
  document.documentElement.setAttribute('data-theme', theme);
  $('themeBtn').textContent = theme === 'night' ? '🌙' : '☀️';
  if (tg) {
    try {
      const bg = theme === 'night' ? '#121212' : '#F5EFE6';
      tg.setHeaderColor(bg); tg.setBackgroundColor(bg);
    } catch(e){}
  }
});

// ============================================================
//  WIRE UP
// ============================================================
$('playBtn').addEventListener('click', togglePlay);
$('nextBtn').addEventListener('click', playNext);
$('prevBtn').addEventListener('click', playPrev);

$('uploadBtn').addEventListener('click', () => {
  if (!state.playing && state.currentIdx === -1) {
    // ok
  }
  $('fileInput').click();
});

$('fileInput').addEventListener('change', async e => {
  await handleFiles(e.target.files);
  e.target.value = '';
});

$('editBtn').addEventListener('click', () => {
  state.editMode = !state.editMode;
  $('editBtn').classList.toggle('active', state.editMode);
  $('editBtn').textContent = state.editMode ? '✓ Готово' : '✎ Режим';
  renderAll();
});

$('volumeSlider').addEventListener('input', e => {
  state.volume = parseInt(e.target.value, 10) / 100;
  if (!state.muted) audio.volume = state.volume;
});

$('muteBtn').addEventListener('click', () => {
  state.muted = !state.muted;
  $('muteBtn').classList.toggle('muted', state.muted);
  audio.volume = state.muted ? 0 : state.volume;
});

// Таймер
setInterval(() => {
  let t = elapsedAccum;
  if (state.playing && !audio.paused) t = audio.currentTime;
  const m = Math.floor(t / 60).toString().padStart(2, '0');
  const s = Math.floor(t % 60).toString().padStart(2, '0');
  $('elapsed').textContent = `${m}:${s}`;
}, 500);

// Пробел
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
    e.preventDefault();
    togglePlay();
  }
});

// Восстановить жанры из localStorage
loadGenres();
renderAll();
</script>
</body>
</html>
